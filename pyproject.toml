[project]
name = "doc-tools"
version = "0.1.0"
description = "Generative AI Document Ingestion Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster",
    "dagster-webserver",
    "unstructured[all-docs]",
    "neo4j",
    "weaviate-client",
    "pikepdf",
    "langchain",
    "pydantic",
    "python-dotenv",
    "minio",
    "python-pptx",
    "baml-py",
    "sparqlwrapper>=2.0.0",
    "dagster-postgres",
    "grpcio!=1.78.1",
    "grpcio-health-checking!=1.78.1",
    "grpcio-status!=1.78.1",
]



[dependency-groups]
dev = [
    "pytest",
]

[tool.dagster]
module_name = "doc_tools.definitions"
