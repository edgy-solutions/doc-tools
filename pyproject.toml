[project]
name = "doc-tools"
version = "0.1.0"
description = "Generative AI Document Ingestion Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster",
    "dagster-webserver",
    "unstructured[all-docs]",
    # Tier-1 extraction: reads parts tables straight from a born-digital PDF's TEXT
    # LAYER (deterministic, sub-second, exact MPNs, per-cell bboxes). Not optional —
    # without it every born-digital notice falls through to the vision pass, which on
    # dense tables fabricates (measured on Diodes PCN 2683: 84 invented MPNs, 100 of
    # 111 real ones missed, after 10.8 minutes). Rides on pdfminer.six, which
    # unstructured[all-docs] already pulls in.
    "pdfplumber",
    "neo4j",
    "weaviate-client>=4.0.0",
    "pikepdf",
    "langchain",
    "openai>=1.0.0",
    "pydantic",
    "dagster-aws",
    "python-pptx>=1.0.0",
    "python-docx>=1.0.0",
    "baml-py==0.222.0",
    "sparqlwrapper>=2.0.0",
    "dagster-postgres",
    "grpcio!=1.78.1",
    "grpcio-health-checking!=1.78.1",
    "grpcio-status!=1.78.1",
    "lxml>=6.0.2",
    "rdflib>=7.6.0",
    "httpx>=0.28.1",
    "boto3>=1.42.68",
    "sqlalchemy",
    "pyodbc",
    "oracledb",
    "dag-tools[orchestrator] @ git+https://github.com/edgy-solutions/dag-tools.git@master",
    "pcpp>=1.30",
    "cyclonedds>=11.0.1",
    "pandas",
    "tabulate",
    "langfuse>=3.0.0",
    "provenance-telemetry @ git+https://github.com/edgy-solutions/provenance-telemetry.git",
    # The mesh's ONE mint implementation, for svc:doc-tools' transport credential on the single
    # engine-o call in assets/semantic_linker.py. PINNED TO A TAG, never a branch: an unpinned
    # ref resolves at BUILD time, so one SDK commit would change this service's auth behaviour
    # on the next rebuild with nobody deciding and no diff here to review.
    #
    # Consuming the shared mint rather than inlining client-credentials is the one-implementation
    # rule: a second mint in this repo would drift from the platform's the way the SDK's and the
    # platform's already did once (MESH_CLIENT_ID vs REVIEW_STARTER_CLIENT_ID).
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.3.1",
]



[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doc_tools*"]

[tool.setuptools.package-data]
# ship the telemetry mapping (read at runtime by doc_tools/telemetry.py) in the wheel
doc_tools = ["config/*.yaml"]

[tool.dagster]
module_name = "doc_tools.definitions"
