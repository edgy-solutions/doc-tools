[project]
name = "doc-tools"
version = "0.1.0"
description = "Generative AI Document Ingestion Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster",
    "dagster-webserver",
    "unstructured[all-docs]",
    "neo4j",
    "weaviate-client>=3.26.7,<4.0.0",
    "pikepdf",
    "langchain",
    "openai>=1.0.0",
    "pydantic",
    "python-dotenv",
    "minio>=7.2.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.0.0",
    "baml-py>=0.20.0",
    "sparqlwrapper>=2.0.0",
    "dagster-postgres",
    "grpcio!=1.78.1",
    "grpcio-health-checking!=1.78.1",
    "grpcio-status!=1.78.1",
    "lxml>=6.0.2",
    "rdflib>=7.6.0",
    "httpx>=0.28.1",
    "boto3>=1.42.68",
    "dag-tools @ git+https://github.com/edgy-solutions/dag-tools.git@branch:main",
]



[dependency-groups]
dev = [
    "pytest",
]

[tool.dagster]
module_name = "doc_tools.definitions"
