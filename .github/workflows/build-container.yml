name: Build Container Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        # Ephemeral: generated on runner only, never checked in.
        run: |
          uv export --format requirements-txt --no-hashes > requirements.txt

      - name: Inject Golden Dockerfile
        # The "Invisible Dockerfile" pattern: developers never see this file.
        # It is generated fresh on every CI run and never committed.
        run: |
          cat << 'EOF' > .dockerignore
          .git
          .github
          .venv
          venv
          __pycache__
          *.pyc
          data/
          tests/
          *.egg-info
          EOF

          cat << 'EOF' > Dockerfile
          # ── Stage 1: Builder (uv-accelerated) ────────────────────
          FROM python:3.12-slim AS builder

          # Pull uv binary for blazing-fast dependency installation
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

          RUN --mount=type=cache,target=/var/cache/apt,sharing=locked \
              --mount=type=cache,target=/var/lib/apt,sharing=locked \
              apt-get update && apt-get install -y --no-install-recommends \
              libmagic-dev \
              tesseract-ocr \
              tesseract-ocr-eng \
              poppler-utils \
              build-essential

          # Create venv and install deps with uv (10-100x faster than pip)
          RUN uv venv /app/venv
          COPY requirements.txt /app/
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /app/venv -r /app/requirements.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              --index-strategy unsafe-best-match

          COPY . /app
          WORKDIR /app

          # ── Stage 2: Runtime (Distroless Debian 12) ─────────────────
          FROM gcr.io/distroless/python3-debian12

          # Copy the entire virtual environment
          COPY --link --from=builder /app/venv /app/venv

          # Copy application source code
          COPY --link --from=builder /app /app

          # Copy native shared libraries required at runtime
          # -- libmagic (python-magic / unstructured)
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libmagic* /usr/lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/share/misc/magic* /usr/share/misc/

          # -- Tesseract OCR
          COPY --link --from=builder /usr/bin/tesseract /usr/bin/tesseract
          COPY --link --from=builder /usr/share/tesseract-ocr /usr/share/tesseract-ocr
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libtesseract* /usr/lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/liblept* /usr/lib/x86_64-linux-gnu/

          # -- Poppler (pdftotext, pdftoppm)
          COPY --link --from=builder /usr/bin/pdftotext /usr/bin/pdftotext
          COPY --link --from=builder /usr/bin/pdftoppm /usr/bin/pdftoppm
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libpoppler* /usr/lib/x86_64-linux-gnu/

          ENV PATH="/app/venv/bin:$PATH"
          ENV PYTHONPATH="/app"
          WORKDIR /app

          # Default process: Dagster webserver.
          # Override in K8s manifests for grpc or worker processes.
          CMD ["/app/venv/bin/python", "/app/venv/bin/dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "doc_tools.definitions"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
