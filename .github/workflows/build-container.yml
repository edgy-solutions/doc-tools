name: Build Container Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        # Ephemeral: generated on runner only, never checked in.
        run: |
          uv export --format requirements-txt > requirements.txt

      - name: Inject Golden Dockerfile
        # The "Invisible Dockerfile" pattern: developers never see this file.
        # It is generated fresh on every CI run and never committed.
        run: |
          cat << 'EOF' > Dockerfile
          # ── Stage 1: Builder ──────────────────────────────────────
          FROM python:3.12-slim AS builder

          RUN apt-get update && apt-get install -y --no-install-recommends \
              libmagic-dev \
              tesseract-ocr \
              tesseract-ocr-eng \
              poppler-utils \
              build-essential \
            && rm -rf /var/lib/apt/lists/*

          RUN python -m venv /app/venv
          ENV PATH="/app/venv/bin:$PATH"

          COPY requirements.txt /app/
          RUN pip install --no-cache-dir -r /app/requirements.txt

          COPY . /app
          WORKDIR /app

          # ── Stage 2: Runtime (Zero-CVE Distroless) ────────────────
          FROM cgr.dev/chainguard/python:latest

          # Copy the entire virtual environment
          COPY --from=builder /app/venv /app/venv

          # Copy application source code
          COPY --from=builder /app /app

          # Copy native shared libraries required at runtime
          # -- libmagic (python-magic / unstructured)
          COPY --from=builder /usr/lib/x86_64-linux-gnu/libmagic* /usr/lib/x86_64-linux-gnu/
          COPY --from=builder /usr/share/misc/magic* /usr/share/misc/

          # -- Tesseract OCR
          COPY --from=builder /usr/bin/tesseract /usr/bin/tesseract
          COPY --from=builder /usr/share/tesseract-ocr /usr/share/tesseract-ocr
          COPY --from=builder /usr/lib/x86_64-linux-gnu/libtesseract* /usr/lib/x86_64-linux-gnu/
          COPY --from=builder /usr/lib/x86_64-linux-gnu/liblept* /usr/lib/x86_64-linux-gnu/

          # -- Poppler (pdftotext, pdftoppm)
          COPY --from=builder /usr/bin/pdftotext /usr/bin/pdftotext
          COPY --from=builder /usr/bin/pdftoppm /usr/bin/pdftoppm
          COPY --from=builder /usr/lib/x86_64-linux-gnu/libpoppler* /usr/lib/x86_64-linux-gnu/

          ENV PATH="/app/venv/bin:$PATH"
          ENV PYTHONPATH="/app"
          WORKDIR /app

          # Default process: Dagster webserver.
          # Override in K8s manifests for grpc or worker processes.
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "doc_tools.definitions"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
