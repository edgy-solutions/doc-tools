name: Build Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # MANUAL REBUILD, added 2026-08-08 because its absence hid a real gap. Commit 3db8dbb
  # (`doc_type_source` attestation — the producer half of fingerprint normalization) was pushed to
  # main and NO build ever ran for it: no run record, no failure, no `[skip ci]` marker. The commit
  # was merged, the feature read as shipped, and the stamp existed in no image.
  #
  # With push as the ONLY trigger there was no way to re-cut an image for a commit whose build was
  # missed, short of an empty commit — so the recovery path was a fake commit, and the natural
  # alternative was to assume it had built. That is the believed-built class with the remedy
  # designed out of reach. A build you cannot re-run on demand is a build you have to take on faith.
  workflow_dispatch:

jobs:
  changes:
    # WHY THIS JOB EXISTS, MEASURED: PR #6 touched four files, all under
    # docs/, and build-and-push still ran the full multi-arch (amd64+arm64,
    # QEMU-emulated) build end to end — 29m53s wall clock — for a diff that
    # could not possibly change the image. It published nothing either way,
    # since the build step's `push:` is already gated on
    # `github.event_name != 'pull_request'`, so that 29m53s bought nothing
    # at all. telemetry-contract (12s) and tests (1m15s) are cheap and are
    # the actual correctness gates, so they are NOT touched here and must
    # keep running on every PR, docs-only included. Note where the gate
    # actually lands: this job has no `if:` and neither do those two — the
    # only `if:` added anywhere is on build-and-push, which is the one job
    # whose cost this is about.
    #
    # GitHub Actions has no such thing as a job-level `paths-ignore` (that
    # only exists on the workflow `on:` trigger, and putting it there would
    # skip telemetry-contract and tests too, which is exactly what must NOT
    # happen). So this job computes the equivalent by hand with a plain
    # `git diff --name-only` and exposes the verdict as an output that
    # build-and-push's `if:` reads. Deliberately not dorny/paths-filter or
    # any other third-party action: the whole point is a single, auditable
    # `git diff` this file's reader can verify by eye, not a dependency on
    # someone else's path-matching semantics.
    #
    # THE IGNORE LIST IS `^docs/` AND NOTHING ELSE. Read this before adding
    # anything to it, especially `charts/`. `charts/` MUST NOT go in this
    # list. Skipping the build on a charts change would be the single worst
    # version of this optimization, because charts/ is precisely what
    # DEPLOYS: values-sandbox.yaml carries the image tag pin and the runtime
    # env — VISION_MAX_TOKENS is live in sandbox right now purely as a
    # values change, no image rebuild involved. A "charts is just config,
    # not code" instinct is exactly backwards for what this job is
    # protecting: build-and-push produces the image, and a values file is
    # how a commit reaches a running pod WITHOUT one. Treat this list as an
    # ALLOWLIST of paths that provably CANNOT reach the image — not a
    # denylist of things that feel unlike code — and `charts/` fails that
    # test outright.
    #
    # FAILS OPEN, ALWAYS. The only acceptable failure mode for this job is
    # "code=true, build anyway" — an unnecessary 29m53s build. The
    # unacceptable one is the workflow_dispatch incident this file already
    # documents below: commit 3db8dbb reached main with no build and no
    # record that one was skipped, and the feature read as shipped while
    # existing in no image. A path-filter bug that skips a real build is
    # that same incident wearing a different hat, so every branch that
    # cannot POSITIVELY PROVE "every changed path matches ^docs/" falls
    # through to code=true: a non-push/pull_request event (workflow_dispatch
    # included), a tag push, a `before` SHA of all zeros (new branch or a
    # force-push history rewrite), a base or head commit this checkout
    # can't find, a failed `git diff`, or even an EMPTY diff (zero changed
    # paths is proof the computation should be distrusted, not proof
    # nothing needs building). None of those get a second, separate escape
    # hatch — they all collapse into the same default this step starts
    # with, so there is exactly one way to end up with code=true and no way
    # for a new edge case to silently invent a second way to end up with
    # code=false.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      # Read by `corpus-gate` below. Separate from `code` because the two ask
      # opposite questions: `code` is "could this diff reach the image", this is
      # "should the corpus release gate be consulted" — and only the second one
      # is what that gate blocks on.
      #
      # THE NAME IS NARROWER THAN THE PREDICATE, deliberately. Since 2026-10-06
      # it is true for `docs/corpus-gate/**` as well as `charts/**` (see the
      # CHARTS block in `decide` for why). The name is kept because renaming an
      # output fails in the WRONG DIRECTION: a typo'd reference evaluates to
      # empty, the `if:` reads false, the job SKIPS, and a skip satisfies the
      # required context — the gate would go inert silently and permanently. A
      # typo inside the regex can only fail open. That asymmetry is the whole
      # reason this reads oddly.
      charts: ${{ steps.decide.outputs.charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this diff can skip the build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Deliberately NOT `set -e`: a git failure below must fall through
          # to the CODE=true default already set, not abort the step before
          # that default is written to GITHUB_OUTPUT.
          set -uo pipefail

          CODE=true
          CHARTS=true

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "event is '$EVENT_NAME' (e.g. workflow_dispatch), no diff range applies -> code=true"
          elif [ "$IS_TAG" = "true" ]; then
            echo "tag push -> code=true unconditionally, a release build is never worth a heuristic"
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base sha (new branch / force-push rewrite) -> code=true"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base sha $BASE_SHA not found in this checkout -> code=true"
          elif ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "head sha $HEAD_SHA not found in this checkout -> code=true"
          else
            # THREE dots, not two. `git diff A B` compares the two trees
            # directly, so if the base branch moved ahead after this PR was
            # cut, every commit main gained shows up here as a REVERSE change
            # — paths this PR never touched, attributed to it. `A...B` diffs
            # against the merge base instead, which is the question actually
            # being asked: what does this branch change relative to where it
            # left the base? The two-dot form fails safe (spurious paths read
            # as "not docs" and the build runs) but it makes the skip fire
            # almost never on a busy base branch, which is the whole feature
            # silently not working. A missing merge base errors out of git
            # and lands on the code=true default below.
            CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              echo "git diff exited $STATUS -> code=true"
            elif [ -z "$CHANGED" ]; then
              echo "diff came back empty -> code=true (not proof of docs-only, just proof to distrust)"
            elif echo "$CHANGED" | grep -qvE '^docs/'; then
              echo "at least one changed path is not under docs/ -> code=true"
              echo "$CHANGED"
            else
              CODE=false
              echo "every changed path matches ^docs/ -> code=false"
              echo "$CHANGED"
            fi
          fi

          # CHARTS: the same fail-open discipline as CODE above, and it lands
          # the same way round for the same reason. charts=true means "run the
          # corpus release gate on this diff", so every case that cannot
          # POSITIVELY PROVE no chart file changed must arrive here as true: an
          # unprovable diff gets the gate, never a pass. `CHANGED` is unset
          # whenever the chain above never reached the git diff (non-push event,
          # tag, unusable/missing sha) and empty when the diff failed or came
          # back empty, and the -n test sends all of those to the true default.
          #
          # The cost of a false true is one cheap job running on a diff that did
          # not need it, and — if the gate is red — an unrelated PR blocked until
          # someone looks. The cost of a false false is a pin deploying with the
          # release gate never consulted, which is the believed-built class this
          # whole file is built around. Those are not close.
          # `docs/corpus-gate/` IS IN THIS PATTERN AND MUST STAY. It is not a
          # deploy, so it reads like it belongs with the other docs — but it is
          # the only path that rewrites the artifact the gate GRADES. Until
          # 2026-10-06 a PR landing a nightly report matched nothing here,
          # concluded SKIPPED, and the skip satisfied the required context: the
          # guard that validates a report was the one job that never ran on the
          # PR that installed one. A malformed, stale or wrong-image
          # `latest.json` could land unchecked, and the next charts/** PR would
          # then be graded against it. Verified on #75, which landed three
          # reports with `corpus-gate` SKIPPED and `mergeStateStatus: CLEAN`;
          # its payload was only ever checked by hand in a scratch worktree.
          #
          # This does NOT make the gate self-approving. The nightly publisher
          # writes the report; this job re-runs tests/test_corpus_gate_guard.py
          # against whatever was written, so the publisher cannot vouch for
          # itself — schema, currency, corpus coverage and image identity are
          # all asserted by a job the publisher does not control.
          if [ -n "${CHANGED:-}" ] && ! echo "$CHANGED" | grep -qE '^(charts/|docs/corpus-gate/)'; then
            CHARTS=false
            echo "no changed path matches ^charts/ or ^docs/corpus-gate/ -> charts=false (corpus gate not consulted)"
          else
            echo "a changed path matches ^charts/ or ^docs/corpus-gate/, or the diff could not be proven -> charts=true"
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"

  telemetry-contract:
    # Fast pre-build gate (ADR-0038): the telemetry mapping must name only fields
    # doc-tools actually produces. The truth-check loads the thin telemetry seam by
    # file path, so it needs the provenance-telemetry leaf + pydantic/pyyaml only —
    # not the full extraction stack — and runs in seconds, ahead of the costly build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Telemetry mapping truth-check
        run: |
          uv run --no-project \
            --with "provenance-telemetry @ git+https://github.com/edgy-solutions/provenance-telemetry.git" \
            --with pytest \
            -- python -m pytest tests/test_telemetry_mapping_truth.py -q

  tests:
    # THE SUITE GATES THE IMAGE. Until this job existed, CI ran exactly ONE test
    # file — the telemetry truth-check above — and the other ~300 tests ran only
    # on whichever machine last happened to run them. An image could be built and
    # pushed with the suite red, and nothing anywhere would say so.
    #
    # That is the same shape this repo has spent a week finding elsewhere: a check
    # that exists, is honest, and gates nothing. `telemetry-contract` was already
    # the correct pattern sitting right above it — a job that `build-and-push`
    # DECLARES A DEPENDENCY ON, so a failure stops the artifact rather than
    # reporting beside it. This job is that pattern applied to the rest of the
    # suite. A red test now means no image, which is the only arrangement in which
    # the suite is load-bearing rather than advisory.
    #
    # COST, STATED HONESTLY: unlike the telemetry check this cannot use
    # `--no-project` — the suite imports the real package, so it needs the real
    # dependency set, and `unstructured[all-docs]` is heavy. setup-uv's cache
    # makes repeat runs cheap. It runs in PARALLEL with telemetry-contract, so the
    # added wall-clock is whatever it exceeds that job by, not its full duration.
    #
    # `uv sync --locked`, AND THE CONCLUSION HERE FLIPPED — 2026-09-19.
    #
    # This block used to argue for a BARE `uv sync`, on two reasons. Both were
    # true when written. BOTH ARE NOW MEASURABLY FALSE, and killing the second
    # one reverses what the argument concludes, so the reasoning is kept rather
    # than quietly replaced.
    #
    # REASON 1 AS WRITTEN: "`uv lock --check` currently reports uv.lock as out of
    # date with respect to pyproject.toml, so `--frozen` would fail this job on
    # its first run." Re-run with the exact command it names, twice, in two
    # checkouts:
    #
    #     uv lock --check   ->  "Resolved 384 packages"   exit 0
    #     git status uv.lock -> clean, untouched
    #
    # Settled, most likely by 41dccac ("reconcile uv.lock — it was two versions
    # of reality behind"). The lockfile drift this reason existed for is gone.
    #
    # REASON 2 AS WRITTEN: "Resolving fresh also matches what the IMAGE gets:
    # build-and-push below runs `uv export --format requirements-txt`, which
    # RESOLVES rather than reading a pinned set, so the tests run against the
    # dependency set that actually ships." Measured:
    #
    #     uv export --format requirements-txt --no-hashes --no-emit-project
    #       ->  iagent-mesh @ git+...@557976d2f1d4ef27584d305fd9ac0d50d9b51d15
    #     uv.lock source
    #       =   ...?rev=v0.9.1#557976d2f1d4ef27584d305fd9ac0d50d9b51d15
    #     uv.lock after export -> untouched
    #
    # `uv export` emits THE LOCK'S RESOLVED COMMIT, character for character. It
    # reads the lock; it does not resolve independently. So the image has been
    # shipping the lock all along.
    #
    # WHICH INVERTS THE CONCLUSION. This block's stated goal is "the tests run
    # against the dependency set that actually ships". The image reads the lock
    # and the test job was resolving fresh — so the BARE FORM IS WHAT DEFEATS
    # THAT GOAL, and `--locked` is what achieves it. The comment was arguing
    # against the fix it wanted, on a premise that had expired underneath it.
    #
    # BOTH HALVES CARRY THE FLAG, here and on the `uv export` in build-and-push,
    # so neither can silently re-resolve and drift from the other. One alone
    # leaves the gap open at the other end.
    #
    # `--locked` rather than `--frozen`: --frozen uses the lock without checking
    # it against pyproject.toml, so a pyproject edit that nobody re-locked would
    # pass silently. --locked ASSERTS they agree and fails loudly if not, which
    # is the failure this whole file keeps paying for in other forms.
    #
    # STILL TRUE, and left standing: reconciling uv.lock is a real fix and a
    # SEPARATE one. Running `uv lock` moves versions in the shipped image and is
    # not a change to make as a side effect. Nothing here re-locks; the lock is
    # already current, which is the whole point above.
    #
    # Live-service tests (LLM endpoint, Jena) skip cleanly without configuration
    # and are expected to skip here — see their pytest.mark.skipif reasons. A
    # SKIP is not a pass, and if that set ever grows this job quietly weakens;
    # `-rs` prints the skip reasons in the log so the set stays visible.
    #
    # THE VISIBILITY WORKED AND WAS READ BACKWARDS — 2026-09-27. `-rs` was
    # printing this job's skip list on every run, and that list did NOT contain
    # "helm binary not on PATH". Three reports nonetheless claimed the twelve
    # chart-guard tests were skipping in CI, on the strength of a stale
    # docstring rather than the log sitting right there. Printing a fact is not
    # the same as anyone checking it. The helm step below is not there to make
    # those tests run — they already did — but to stop them depending on an
    # ambient runner binary, and REQUIRE_HELM is there so the next person who
    # assumes gets a red job instead of a green one. Note what stays true: helm
    # is a TEST FIXTURE here, not a dependency of the image; nothing in the
    # built container shells out to it.
    #
    # FUSEKI SERVICE CONTAINER, added alongside the default-graph seal
    # (doc_tools_tests/test_default_graph_stays_empty.py). Same shape as the
    # helm story above: doc_tools_tests/test_plugin_sparql_integration.py has
    # carried four live-Fuseki tests since it was written, and every one of
    # them has SKIPPED on every run there has ever been, because no CI job
    # has ever had a Jena to talk to — `JENA_INTEGRATION_URL` was never set.
    # A skip is not a pass, and the seal added in this lane (the Jena default
    # graph is empty after driving all four plugins' real SPARQL through the
    # scoping writer) is exactly the kind of check that reads as covered
    # while being grey — the same trap this job already exists to close for
    # the suite as a whole. This service container gives those five tests
    # something real to run against, and REQUIRE_JENA (below, mirroring
    # REQUIRE_HELM) turns "Fuseki went missing" into a FAILURE instead of a
    # silent return to skipping.
    #
    # `stain/jena-fuseki`, not `apache/jena-fuseki` — checked, not assumed:
    # `apache/jena-fuseki` does not exist on Docker Hub (pull returns "pull
    # access denied ... repository does not exist") and there is no
    # `ghcr.io/apache/jena-fuseki` either (pull returns "not found"). Pinned
    # to 5.1.0, verified by pulling and running it locally.
    #
    # THE HEALTH CHECK PROBES THE DATASET, NOT `/$/ping`, and the difference
    # was measured rather than guessed. `/$/ping` answers 200 as soon as the
    # JVM is up; `FUSEKI_DATASET_1=ds` then auto-creates the `ds` dataset
    # over the admin API a moment afterwards. Timed locally from container
    # start: ping at 2797ms, `ds` present in `/$/datasets` at 4195ms — a
    # ~1.4s window in which a ping-based check reports HEALTHY and every
    # request to `/ds` 404s. The job's own checkout and `uv sync` would
    # almost always cover that gap, which is exactly what makes it a flake
    # rather than an outage: it would fail rarely, on a slow runner, and
    # look like something else. Probing `/$/datasets` for `/ds` closes it —
    # the job starts when the dataset the tests actually use exists.
    # (`ci-fuseki-admin` is this service container's throwaway password, set
    # by `ADMIN_PASSWORD` immediately above and never leaving the runner.)
    #
    # COST, STATED HONESTLY: a service container's image pull plus JVM
    # startup on every run of this job, in addition to the suite itself.
    # `stain/jena-fuseki:5.1.0` is not a common image, so a GitHub-hosted
    # runner should not be expected to already have it cached — budget for
    # a real pull most runs. Startup to a queryable `ds` was ~4s locally.
    services:
      fuseki:
        image: stain/jena-fuseki:5.1.0
        ports:
          - 3030:3030
        env:
          ADMIN_PASSWORD: ci-fuseki-admin
          FUSEKI_DATASET_1: ds
        options: >-
          --health-cmd "curl -sf -u admin:ci-fuseki-admin http://localhost:3030/\$/datasets | grep -q '/ds' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install helm
        # THE TWELVE CHART TESTS WERE ALREADY RUNNING HERE. That is not what
        # anyone believed, this lane included -- the docstring of
        # tests/test_chart_image_pin_guard.py said "CI has no helm step today,
        # so a skip here means unproven", three reports repeated it, and it was
        # WRONG. Measured across three main runs (55a6292, f3daa3b, 8eeda5e):
        # ZERO occurrences of the "helm binary not on PATH" skip reason, which
        # `-rs` had been printing all along. The runner image ships helm
        # (ubuntu-24.04: Helm 3.22.0), so the guard has been genuinely proven in
        # CI since #13 merged.
        #
        # WHAT WAS ACTUALLY WRONG IS SUBTLER, AND IS WHAT THIS STEP FIXES. The
        # proof rested on an AMBIENT binary nobody declared: not requested, not
        # version-controlled, and outside this repo's control entirely. GitHub
        # can drop or move helm in any runner image update, and on the day they
        # do, all twelve tests return to SKIPPING and this job stays GREEN over
        # an unproven guard. Declaring the dependency is the difference between
        # "it works" and "it is arranged to work".
        #
        # PINNED, not `latest`. The binary is the test fixture: an unpinned helm
        # means the rendering under test can change with no commit in this repo,
        # the same drift this file spends eighty lines arguing against for the
        # dependency set. v3.14.3 is the version that renders sandbox IN
        # PRACTICE -- it is what runs `helm upgrade` by hand -- so CI proves the
        # guard against the helm that actually deploys rather than against
        # whatever the runner shipped this week.
        #
        # THE TRADE, STATED: this moves CI from 3.22.0 to 3.14.3, so CI stops
        # exercising a modern helm. That is deliberate (deploy-side fidelity
        # beats novelty for a guard whose whole job is to predict what happens
        # at `helm upgrade` time) but it is a real narrowing, not a free win.
        # Both versions pass today -- 3.22.0 in CI on the three runs above,
        # 3.14.3 locally -- so the guard is not version-fragile so far. When the
        # workstation helm moves, move this with it.
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the test suite
        # REQUIRE_HELM turns a missing binary from a SKIP into a FAILURE -- see
        # tests/test_chart_image_pin_guard.py. This is the half that actually
        # protects anything: the install step above only fixes today, and
        # without this, deleting it (or a future runner change) sends twelve
        # tests back to grey with the job still green. THAT is the state this
        # repo keeps rediscovering -- a check that exists, is honest, and gates
        # nothing. With this set, a missing helm reds the job and says why.
        env:
          REQUIRE_HELM: "1"
          # Points at the `fuseki` service container declared on this job
          # above. REQUIRE_JENA mirrors REQUIRE_HELM: turns "Fuseki is
          # unreachable" from a silent skip of five tests into a job
          # failure that says why, rather than a job that stays green over
          # an unproven guard.
          JENA_INTEGRATION_URL: http://localhost:3030
          JENA_INTEGRATION_DS: ds
          JENA_INTEGRATION_USER: admin
          JENA_INTEGRATION_PASSWORD: ci-fuseki-admin
          REQUIRE_JENA: "1"
        run: uv run -- python -m pytest -q -rs

  verify-image-pin:
    # THE CLAIM MADE CHECKED, NOT JUST REVIEWABLE. `_helpers.tpl` (see the
    # comment above `doc-tools.image`) turned an invisible assumption into a
    # reviewable claim: a digest pin, or a tag pin with a human's written ack
    # that they checked. Neither Helm nor that guard ever reaches a registry --
    # `helm template`/`helm upgrade` cannot issue an HTTP request -- so
    # "reviewable" was as far as rendering alone could ever get. This job is
    # what makes the claim a CHECKED FACT: it queries ghcr.io directly, in CI,
    # for every tracked values-*.yaml, and reds if the pinned manifest is not
    # actually there. It is the same incident class as d7434d6 (see
    # scripts/verify_image_pin.py's module docstring for the full account) --
    # this job is what would have caught that pin BEFORE it reached sandbox,
    # rather than at the kubelet several minutes into a "successful" release.
    #
    # NOT GATED ON `needs.changes.outputs.code`. That gate exists to skip the
    # expensive multi-arch build on a docs-only diff (see the `changes` job's
    # comment on why `charts/` can never join that ignore list) -- this job is
    # not expensive, it is a handful of HTTPS GETs, and charts/values changes
    # are EXACTLY what it exists to protect. Skipping it on the one class of
    # diff it is watching for would be the same mistake the `changes` job's
    # comment already warns against, one level up.
    #
    # NOT IN `build-and-push`'s `needs:`. A ghcr.io hiccup (rate limit, a
    # transient 5xx -- this script's own UNDETERMINED/exit-2 bucket) must not
    # block a build that has nothing to do with the registry read succeeding
    # right now. This job protects the values files that are ALREADY merged
    # against naming a phantom image; it is not a precondition for producing a
    # new one.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # NO `packages: read`. The image is public: an anonymous
      # `GET https://ghcr.io/token?...` already returns a usable pull token,
      # measured directly against ghcr.io (see verify_image_pin.py's
      # docstring). If the package is ever made private, this job REDS with
      # exit 2 (UNDETERMINED, not a false green) rather than silently passing
      # a registry it can no longer read -- and the fix is to set
      # `packages: read` here and let the script's GITHUB_TOKEN Basic-auth
      # path (already implemented) take over, not to add a token nobody needs
      # today.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Resolve the pinned image against ghcr.io
        # --no-project: stdlib + PyYAML only, no reason to sync the whole
        # doc-tools dependency set (unstructured[all-docs] et al.) for a
        # script that never imports the package. `--require-platform` for
        # BOTH arches is asserted HERE, in CI, rather than in the chart,
        # because Helm cannot reach a registry to check it there. This is not
        # a formality: every node in the sandbox k3s cluster is arm64 (all 7
        # measured, server and workers alike),
        # so an index missing its arm64 child renders perfectly through every
        # Helm-side guard and fails only at the kubelet, on real hardware,
        # after the release already reports successful -- the exact failure
        # shape one layer further down from d7434d6.
        run: |
          uv run --no-project --with pyyaml \
            python scripts/verify_image_pin.py \
            --require-platform linux/amd64 \
            --require-platform linux/arm64

  corpus-gate:
    # THE RELEASE GATE FOR A PIN. The order this implements: "on every doc-tools
    # pin, three fires by identity plus header agreement, against the pinned
    # image in sandbox, nightly. Red blocks the next pin."
    #
    # THE FIRES DO NOT RUN HERE, AND CANNOT. Every runner in this file is
    # `ubuntu-latest` on GitHub-hosted infrastructure. The corpus harness needs
    # the header LLM at 192.168.1.126 and the vision model at
    # 192.168.1.169:11434 (both RFC1918, one model at a time) and reads the
    # notices from `iagent-minio:9000`, an in-cluster DNS name. None of the
    # three is reachable from here, and a fire set is ~22 minutes x3. So the run
    # lives in an opt-in CronJob
    # (charts/doc-tools/templates/corpus-gate-cronjob.yaml) inside the cluster,
    # its report is committed to docs/corpus-gate/latest.json, and THIS job
    # checks the committed report. The split is forced by the network, not
    # chosen for speed.
    #
    # IT ASSERTS CURRENCY AND IDENTITY, NOT THE OUTCOME — 2026-10-04, retargeted
    # by ruling. This job is the single REQUIRED status check on main (verified:
    # `required_status_checks.contexts == ["corpus-gate"]`, no required
    # reviews). Merging the honest nightly FAIL (#67) therefore froze merging
    # for the whole repo, circularly: the extraction fix that turns the verdict
    # green has to merge through the check the red verdict was failing. #68
    # (charts) concluded FAILURE and read mergeStateStatus BLOCKED.
    #
    # The split that fixes it: this job asserts only that the committed report
    # IS EVIDENCE ABOUT THIS CODE (present, parseable, fresh, naming its corpus
    # and image, identity-reconciled, not void) — cheap, and unfalsifiable by
    # an extraction defect. A measured `fail` warns here instead of failing.
    # The OUTCOME assertion moved to `corpus-gate-verdict` below, which keeps
    # "red blocks the next pin". See tests/test_corpus_gate_guard.py's
    # docstring section "WHY THE REQUIRED CHECK NO LONGER ASSERTS THE OUTCOME"
    # for the measurement behind this.
    #
    # THE `if:` STAYS, AND A SKIP IS NOT A BLOCK — corrected 2026-10-05. I
    # briefly removed this scoping on the premise that a required context
    # concluding SKIPPED is never satisfied. That premise is FALSE: #69 touches
    # no charts, its `corpus-gate` concluded SKIPPED, and it reads
    # mergeable=MERGEABLE / mergeStateStatus=CLEAN with `corpus-gate` still the
    # only required context. A job-level skip reports conclusion `skipped` and
    # GitHub treats that as satisfying the requirement. The earlier BLOCKED
    # reading was a `mergeStateStatus` sampled minutes after the PR was opened,
    # before the checks had concluded — that field is computed asynchronously
    # and goes stale. So #68's FAILURE was the ONLY structural block.
    #
    # Keeping the scoping is not merely harmless, it is the safer design: an
    # always-dispatched currency assertion would block EVERY PR whenever the
    # nightly stops producing or goes void — the same wedge class the retarget
    # just removed, reached from the staleness side. Currency only matters
    # where a pin can ship, and that is a chart diff.
    #
    # NOT IN `build-and-push`'s `needs:`, following verify-image-pin above. This
    # job decides whether the CHART may change, not whether an image may be
    # produced — and a pin bump points at a digest that already exists, so
    # gating image production would not block a pin anyway. Its own red status
    # is the block.
    #
    # WHAT MAKES IT A GATE AND NOT A REPORT: the guard FAILS on a missing
    # report rather than skipping (tests/test_corpus_gate_guard.py, and the
    # d7434d6 incident its docstring cites), and it fails on a stale one, so a
    # report that stopped being produced cannot read as a pass.
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Corpus gate report must be current and identity-reconciled
        # `--no-project` + `--with pytest`, like telemetry-contract: the guard
        # reads a committed JSON with stdlib only, so it needs no extraction
        # stack and no `uv sync`. Runs in seconds.
        #
        # `-m corpus_gate` is REQUIRED, not decorative. pyproject.toml sets
        # `addopts = -m "not corpus_gate"`, so these tests are deselected from
        # the default suite — that is what keeps a red gate out of the `tests`
        # job, where it would block every PR. This job is the one place the
        # marker is selected, and `-rs` prints any skip reason rather than
        # hiding it.
        #
        # `and not corpus_gate_verdict` is the whole retarget. Both halves live
        # in one file under the module-level `corpus_gate` mark; this selection
        # is what keeps the OUTCOME assertion out of the required check.
        run: |
          uv run --no-project --with pytest \
            -- python -m pytest tests/test_corpus_gate_guard.py \
               -m "corpus_gate and not corpus_gate_verdict" -q -rs

  corpus-gate-verdict:
    # "RED BLOCKS THE NEXT PIN" — the outcome half, and the only place a FAIL
    # verdict stops anything. A pin bump IS a chart change, so scoping to
    # charts/** blocks the pin while leaving ordinary code PRs free. This is the
    # assertion that was wedging the repo when it lived in the required job.
    #
    # ADVISORY UNTIL IT IS ADDED TO main's REQUIRED CONTEXTS. Right now
    # `corpus-gate` is the only required check, so this job going red shows on
    # the PR but does not block the merge button. Making it required is a
    # repo-settings change — and note that it would re-create the original
    # wedge by a different name: a red verdict would once again block the
    # extraction fix that turns it green. If you make it required, the escape
    # hatch has to be explicit (an override label the job reads), not the
    # `if:`.
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: A chart diff may not ship on a failing corpus report
        run: |
          uv run --no-project --with pytest \
            -- python -m pytest tests/test_corpus_gate_guard.py \
               -m corpus_gate_verdict -q -rs

  build-and-push:
    # BOTH gates, not one. `needs` is what makes them gates rather than reports:
    # a failure in either stops the image from being built or pushed.
    #
    # `changes` is added to `needs` too, but it is not a correctness gate in
    # that same sense — it never fails the build on purpose, it decides
    # whether this diff needs one at all (see the `changes` job above for
    # the full fail-open reasoning and why `charts/` can never be added to
    # its ignore list). `needs` is required here regardless, because reading
    # another job's `outputs` — `needs.changes.outputs.code` below — only
    # works for jobs already listed in `needs`. The `if:` is what actually
    # acts on it.
    needs: [telemetry-contract, tests, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free GitHub runner disk space (~10 GB)
        # 2026-06-30: build failed with "No space left on device" during
        # `uv pip install` of transformers — the image is large (LibreOffice
        # + Inkscape + Tesseract + transformers + spaCy + pre-downloaded HF
        # models) and exceeds the ~14 GB free on a default ubuntu-latest
        # runner. Stripping the pre-baked Android/dotnet/ghc/etc. payloads
        # frees enough room for the layered image build.
        run: |
          set -e
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "=== after ==="; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        run: |
          # --no-emit-project: emit dependencies only, NOT the doc-tools project itself.
          # pyproject now declares a [build-system], so the project is a real package and
          # uv export would otherwise add an "-e ." line. The Docker build only COPYs
          # requirements.txt into /app (no pyproject.toml present), so trying to install "."
          # fails with "/app does not appear to be a Python project".
          #
          # --locked added 2026-09-19, the other half of the change in the tests
          # job above. `uv export` already read the lock rather than resolving —
          # that was measured, and it is why the tests job moved to `--locked` to
          # MATCH this step. The flag makes the existing behaviour explicit and
          # refuses rather than silently re-resolving if pyproject.toml and
          # uv.lock ever stop agreeing. Without it on BOTH halves, one end can
          # drift from the other and the gate stops testing what ships.
          uv export --locked --format requirements-txt --no-hashes --no-emit-project > requirements.txt

      - name: Inject Golden Dockerfile
        run: |
          # 1. Create the Dockerignore (Keeps context small so build starts instantly)
          cat << 'EOF' > .dockerignore
          # VCS / CI
          .git
          .gitignore
          .gitattributes
          .github
          
          # Python envs & caches
          .venv
          venv
          env
          __pycache__
          *.py[cod]
          *.egg-info
          .eggs
          dist
          build
          .mypy_cache
          .pytest_cache
          .ruff_cache
          .coverage
          htmlcov
          .tox
          
          # Tool / model caches that must NEVER leak into context
          .cache
          .huggingface
          .hf_cache
          .nltk_data
          .spacy
          
          # Large binary artifacts
          *.onnx
          *.pt
          *.pth
          *.safetensors
          *.bin
          *.ckpt
          *.h5
          *.hdf5
          *.pkl
          *.pickle
          *.parquet
          *.arrow
          *.sqlite
          *.db
          models/
          checkpoints/
          weights/
          
          # Data
          data
          datasets
          *.csv
          *.tsv
          *.jsonl
          
          # Dev artifacts
          logs
          *.log
          tmp
          .tmp
          *.tar
          *.tar.gz
          *.tgz
          *.zip
          
          # Editors / OS
          .idea
          .vscode
          *.swp
          .DS_Store
          Thumbs.db
          
          # Node (if any)
          node_modules
          
          # Docker itself
          Dockerfile*
          .dockerignore
          docker-compose*.yml
          
          # Tests
          tests
          EOF
          
          # 2. Create the Dockerfile
          cat << 'EOF' > Dockerfile
          # syntax=docker/dockerfile:1.6

          # ============================================================================
          # Builder: CycloneDDS C core + Python bindings, both from source at 11.0.1.
          # Avoids the broken PyPI cp312 wheel entirely by building our own.
          # ============================================================================
          FROM python:3.12-slim AS cyclonedds-builder

          RUN apt-get update && apt-get install -y --no-install-recommends \
                git cmake build-essential bison ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          ARG CYCLONEDDS_REF=11.0.1
          ARG CYCLONEDDS_PYTHON_REF=11.0.1

          # --- C core ---------------------------------------------------------------
          RUN git clone --depth 1 --branch "${CYCLONEDDS_REF}" \
                https://github.com/eclipse-cyclonedds/cyclonedds.git /src/cdds \
           && cmake -S /src/cdds -B /build/cdds \
                -DCMAKE_INSTALL_PREFIX=/opt/cyclonedds \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_IDLC=ON \
                -DENABLE_SSL=NO -DENABLE_SECURITY=NO -DENABLE_SHM=NO \
                -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
           && cmake --build /build/cdds --target install -j"$(nproc)" \
           && rm -rf /src /build

          # --- Python bindings (built against our C core) ---------------------------
          ENV CYCLONEDDS_HOME=/opt/cyclonedds \
              CMAKE_PREFIX_PATH=/opt/cyclonedds \
              PATH=/opt/cyclonedds/bin:$PATH \
              LD_LIBRARY_PATH=/opt/cyclonedds/lib

          RUN git clone --depth 1 --branch "${CYCLONEDDS_PYTHON_REF}" \
                https://github.com/eclipse-cyclonedds/cyclonedds-python.git /src/cdp \
           && pip wheel --no-cache-dir --no-deps --wheel-dir=/wheels /src/cdp \
           && rm -rf /src

          # ============================================================================
          # Final image: your existing Python 3.12 env, plus /opt/cyclonedds + wheel.
          # ============================================================================
          FROM python:3.12-slim

          # PROVENANCE STAMP (ADR-0034) — the extractor's identity, baked into the image.
          # Written into every review.json as `pipeline_version`; the trust table is KEYED on it,
          # so a rung earned under one extractor does not survive that extractor changing.
          # The default is deliberately a LOUD sentinel rather than a plausible-looking version:
          # an unstamped image must be obvious in the corpus, not blend in.
          ARG DOC_TOOLS_VERSION=doc-tools@unstamped
          ENV DOC_TOOLS_VERSION=${DOC_TOOLS_VERSION}

          # Set environment variables so Python prints directly to logs
          ENV PYTHONUNBUFFERED=1
          ENV PYTHONDONTWRITEBYTECODE=1
          ENV DO_NOT_TRACK=true
          ENV HF_HUB_DISABLE_TELEMETRY=1
          ENV SCARF_NO_ANALYTICS=true
          ENV HF_HOME=/app/.cache/huggingface

          # Install system dependencies (Tesseract, Poppler, libmagic, LibreOffice for MS docs, CycloneDDS runtime libs, MS SQL Driver, and Inkscape for CGM->PNG conversion in the IADS ingest path)
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git libmagic1 libgl1 tesseract-ocr tesseract-ocr-eng poppler-utils \
              libreoffice curl gnupg2 apt-transport-https libstdc++6 inkscape \
           && curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | \
              gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg \
           && curl -fsSL https://packages.microsoft.com/config/debian/12/prod.list \
              > /etc/apt/sources.list.d/mssql-release.list \
           && apt-get update \
           && ACCEPT_EULA=Y apt-get install -y --no-install-recommends \
              msodbcsql18 unixodbc-dev \
           && rm -rf /var/lib/apt/lists/*

          COPY --from=cyclonedds-builder /opt/cyclonedds /opt/cyclonedds
          COPY --from=cyclonedds-builder /wheels /wheels

          ENV CYCLONEDDS_HOME=/opt/cyclonedds \
              PATH=/opt/cyclonedds/bin:$PATH \
              LD_LIBRARY_PATH=/opt/cyclonedds/lib

          # KEEP /wheels around — install the cyclonedds wheel into the
          # iagent venv below via --find-links so uv pip install doesn't
          # try to rebuild from sdist on arm64 (which fails because gcc
          # isn't available in this slim runtime image).
          RUN pip install --no-cache-dir --no-deps /wheels/*.whl

          # Build-time smoke test
          RUN idlc -v \
           && python3 -c "import cyclonedds; from cyclonedds.idl import IdlStruct, IdlEnum" \
           && mkdir /tmp/smoke && cd /tmp/smoke \
           && printf 'module M { enum E { A, B }; struct S { long x; E e; string n; }; };\n' > s.idl \
           && idlc -l py s.idl \
           && test -f M/_s.py \
           && PYTHONPATH=/tmp/smoke python3 -c "from M import S, E; s = S(x=1, e=E.B, n='ok'); print('roundtrip:', s)" \
           && rm -rf /tmp/smoke \
           && echo "=== cyclonedds 11.0.1 stack fully verified ==="

          # Pull uv binary for blazing-fast dependency installation
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

          WORKDIR /app

          # Create a standard virtual environment and install dependencies
          # venv lives OUTSIDE WORKDIR /app on purpose. nltk >=3.10.1 ships a CWE-427
          # guard (nltk/inisec.py) that blocks any import nltk makes which resolves under
          # Path.cwd(); with the venv inside /app it flagged every site-packages module
          # (regex, joblib, ...) as a CWD import and aborted the build (and would abort
          # extraction at runtime). Keeping site-packages at /opt/venv lets the guard do
          # its job (still blocks a real /app CWD hijack) without the false positive.
          # -P/PYTHONSAFEPATH does NOT fix this — the finder checks cwd ancestry, not sys.path.
          RUN uv venv /opt/venv
          COPY requirements.txt /app/

          # ADD THE INDEX STRATEGY FLAG HERE
          # --find-links /wheels: makes uv prefer the cyclonedds wheel
          # we built in the cyclonedds-builder stage over rebuilding from
          # sdist. Critical on arm64 where PyPI has no prebuilt cyclonedds
          # wheel and the final runtime image lacks gcc/cmake.
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /opt/venv --find-links /wheels -r /app/requirements.txt \
           && rm -rf /wheels

          # Copy the application code
          COPY . /app

          # Put the virtual environment in the PATH so 'dagster' commands work natively
          ENV PATH="/opt/venv/bin:$PATH"
          ENV PYTHONPATH="/app"

          # Pre-download spaCy model to avoid runtime SSL issues during NLP extraction
          # Using uv pip install directly instead of `python -m spacy download` because uv environments don't have pip
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /opt/venv https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

          # Pre-download unstructured NLP models to avoid runtime SSL issues
          RUN uv pip install --python /opt/venv nltk huggingface_hub
          RUN /opt/venv/bin/python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('averaged_perceptron_tagger')"
          RUN /opt/venv/bin/python -c "from huggingface_hub import hf_hub_download, snapshot_download; hf_hub_download(repo_id='unstructuredio/yolo_x_layout', filename='yolox_l0.05.onnx'); snapshot_download(repo_id='microsoft/table-transformer-structure-recognition'); snapshot_download(repo_id='timm/resnet18.a1_in1k')"

          # Enforce HF offline mode strictly at runtime, after models are natively baked in
          ENV HF_HUB_OFFLINE=1

          # Standard Dagster Webserver command
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "doc_tools.definitions"]
          EOF

      # QEMU emulation for cross-arch builds. Required for the arm64
      # variant on x86_64 GitHub-hosted runners — otherwise build-push-action
      # silently produces a single-arch amd64 image and arm64 k8s clusters
      # fail to pull with `no matching manifest for linux/arm64/v8 in
      # manifest list entries`. Pair with `platforms:` on the build step.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"
          
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose context size
        run: |
          echo "=== top 20 largest entries in context ==="
          du -sh ./* ./.[!.]* 2>/dev/null | sort -rh | head -20
          echo
          echo "=== total size ==="
          du -sh .
          echo
          echo "=== what .dockerignore would exclude ==="
          cat .dockerignore
          echo
          echo "=== .git size (common culprit) ==="
          du -sh .git 2>/dev/null || echo "no .git"

      - name: Build and Push
        # id: so the NEXT step can read steps.build.outputs.digest. The action has
        # always exported it; nothing ever read it.
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Multi-arch: matches the runtime cluster shapes we deploy to
          # (linux/amd64 GitHub-hosted CI runners, linux/arm64 k3s clusters).
          # Build time roughly doubles because the arm64 layer goes through
          # QEMU emulation; cache-to/from=gha amortizes the cost across runs.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # PROVENANCE STAMP (ADR-0034). The extractor's own identity, baked at BUILD time so it
          # cannot be unset, forgotten, or overridden per-deploy. It is written into every
          # review.json as `pipeline_version`, and the trust table is KEYED on it: a rung is earned
          # under a specific extractor and must not survive that extractor changing.
          #
          # WHY BAKED AND NOT AN ENV VAR. The consumer side already tried env-var versioning
          # (PIPELINE_VERSION on the Dagster sensor) and it was UNSET on every pod in sandbox — so
          # every decision record carries "unset" and the trust key's second axis has exactly one
          # value in it. An env var that must be remembered fails silent; a build-arg sha cannot.
          build-args: |
            DOC_TOOLS_VERSION=doc-tools@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE PIN A REVIEWER CAN TRUST, PRINTED WHERE THEY WILL LOOK.
      # charts/doc-tools/templates/_helpers.tpl now refuses a tag that has not
      # been shown to exist, and prefers a digest, because a tag is GUESSABLE
      # FROM GIT and a digest is not: a digest exists only as the output of a
      # real push, so it cannot name an image that was never built. That guard
      # is only usable if the digest is easy to find, and it was not printed
      # anywhere -- getting it meant querying the ghcr API with a read:packages
      # token, which is exactly the friction that makes people pin the tag they
      # can read out of git log instead.
      #
      # Skipped on pull_request because push is false there, and the digest of a
      # build that was never pushed is not a pin anyone can deploy.
      - name: Publish the image digest as the pin to copy
        if: github.event_name != 'pull_request'
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          if [[ -z "$DIGEST" ]]; then
            echo "::warning::build-push-action reported no digest for this build, so there is no digest pin to copy. Pinning by tag will require image.unverifiedTagAck."
            exit 0
          fi
          {
            echo "## Image pin"
            echo
            echo "Paste into \`charts/doc-tools/values-<env>.yaml\` under \`image:\`, and DELETE the \`tag:\` and \`unverifiedTagAck:\` lines, which a digest replaces:"
            echo
            echo '```yaml'
            echo "  digest: \"$DIGEST\""
            echo '```'
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| digest | \`$DIGEST\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| tags pushed | \`${{ steps.meta.outputs.version }}\`, \`${{ github.sha }}\` |"
            echo
            echo "Verify independently of this log: \`docker pull $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST"