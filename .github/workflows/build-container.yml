name: Build Container via CNB

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate Requirements for CNCF Buildpack
        # The Paketo Python Buildpack will automatically detect and use requirements.txt
        run: |
          uv export --format requirements-txt > requirements.txt

      - name: Set up Pack CLI (Cloud Native Buildpacks)
        uses: buildpacks/github-actions/setup-pack@v5.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        run: |
          # Use local daemon to build only if on PR. On main branch push, add --publish
          # Repository name must be lowercase
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LOWER"
          
          PUBLISH_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PUBLISH_FLAG="--publish"
          fi
          
          # Let the builder use its full default buildpack group.
          # This ensures the CNB lifecycle launcher is set as the entrypoint
          # and project.toml process types (web, grpc, worker) are registered.
          pack build $IMAGE_NAME:latest \
            --builder paketobuildpacks/builder-jammy-base \
            --tag $IMAGE_NAME:${{ github.sha }} \
            $PUBLISH_FLAG \
            --path .
