name: Build Container Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        run: |
          uv export --format requirements-txt --no-hashes > requirements.txt

      - name: Inject Golden Dockerfile
        run: |
          # 1. Create the Dockerignore (Keeps context small so build starts instantly)
          cat << 'EOF' > .dockerignore
          .git
          .github
          .venv
          venv
          __pycache__
          *.pyc
          data/
          tests/
          *.egg-info
          EOF
          
          # 2. Create the Single-Stage Dockerfile
          cat << 'EOF' > Dockerfile
          # syntax=docker/dockerfile:1
          FROM python:3.12-slim

          # Set environment variables so Python prints directly to logs
          ENV PYTHONUNBUFFERED=1
          ENV PYTHONDONTWRITEBYTECODE=1

          # Install system dependencies (Tesseract, Poppler, libmagic)
          RUN apt-get update && apt-get install -y --no-install-recommends \
              libmagic1 \
              libgl1 \
              tesseract-ocr \
              tesseract-ocr-eng \
              poppler-utils \
              && rm -rf /var/lib/apt/lists/*

          # Pull uv binary for blazing-fast dependency installation
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

          WORKDIR /app

          # Create a standard virtual environment and install dependencies
          RUN uv venv /app/venv
          COPY requirements.txt /app/
          
          # ADD THE INDEX STRATEGY FLAG HERE
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /app/venv -r /app/requirements.txt

          # Copy the application code
          COPY . /app

          # Put the virtual environment in the PATH so 'dagster' commands work natively
          ENV PATH="/app/venv/bin:$PATH"
          ENV PYTHONPATH="/app"

          # Pre-download spaCy model to avoid runtime SSL issues during NLP extraction
          # Using uv pip install directly instead of `python -m spacy download` because uv environments don't have pip
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --python /app/venv https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

          # Pre-download unstructured NLP models to avoid runtime SSL issues
          RUN uv pip install --python /app/venv nltk huggingface_hub
          RUN /app/venv/bin/python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('averaged_perceptron_tagger')"
          RUN /app/venv/bin/python -c "from huggingface_hub import hf_hub_download, snapshot_download; hf_hub_download(repo_id='unstructuredio/yolo_x_layout', filename='yolox_l0.05.onnx'); snapshot_download(repo_id='microsoft/table-transformer-structure-recognition')"

          # Standard Dagster Webserver command
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "doc_tools.definitions"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max