name: Build Container Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate requirements.txt from pyproject.toml
        run: |
          uv export --format requirements-txt --no-hashes > requirements.txt

      - name: Inject Golden Dockerfile
        run: |
          # 1. Create the Dockerignore (EOF markers MUST be flush left)
          cat << 'EOF' > .dockerignore
          .git
          .github
          .venv
          venv
          __pycache__
          *.pyc
          data/
          tests/
          *.egg-info
          EOF
          
          # 2. Create the Dockerfile (EOF markers MUST be flush left)
          cat << 'EOF' > Dockerfile
          # syntax=docker/dockerfile:1
          
          # ── Stage 1: Builder (Python 3.12 pinned to Debian 12 Bookworm) ──
          FROM python:3.12-slim-bookworm AS builder

          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

          RUN --mount=type=cache,target=/var/cache/apt,sharing=locked \
              --mount=type=cache,target=/var/lib/apt,sharing=locked \
              apt-get update && apt-get install -y --no-install-recommends \
              libmagic-dev \
              tesseract-ocr \
              tesseract-ocr-eng \
              poppler-utils \
              build-essential

          COPY requirements.txt /app/
          
          # Install deps to /app/deps (NO virtual environment)
          RUN --mount=type=cache,target=/root/.cache/uv \
              uv pip install --system --target=/app/deps -r /app/requirements.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              --index-strategy unsafe-best-match

          COPY . /app
          WORKDIR /app

          # ── Stage 2: Runtime (Distroless Base Debian 12) ─────────────────
          # 'base' includes zlib, openssl, and ca-certificates natively
          FROM gcr.io/distroless/base-debian12

          # 1. THE SAFETY NET: Copy 'env' so standard Python shebangs never crash
          COPY --link --from=builder /usr/bin/env /usr/bin/env

          # 2. Transplant the Python 3.12 interpreter from the slim image!
          COPY --link --from=builder /usr/local/bin/python /usr/local/bin/python
          COPY --link --from=builder /usr/local/lib/libpython3.12.so* /usr/local/lib/
          COPY --link --from=builder /usr/local/lib/python3.12 /usr/local/lib/python3.12

          # 2.5 Transplant the remaining OS C-libraries Python expects
          COPY --link --from=builder /lib/x86_64-linux-gnu/libexpat* /lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libffi* /usr/lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libsqlite3* /usr/lib/x86_64-linux-gnu/

          # 3. Copy the Python dependencies and our app
          COPY --link --from=builder /app/deps /app/deps
          COPY --link --from=builder /app /app

          # 4. Copy native shared libraries (Tesseract, Poppler, etc.)
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libmagic* /usr/lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/share/misc/magic* /usr/share/misc/

          COPY --link --from=builder /usr/bin/tesseract /usr/bin/tesseract
          COPY --link --from=builder /usr/share/tesseract-ocr /usr/share/tesseract-ocr
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libtesseract* /usr/lib/x86_64-linux-gnu/
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/liblept* /usr/lib/x86_64-linux-gnu/

          COPY --link --from=builder /usr/bin/pdftotext /usr/bin/pdftotext
          COPY --link --from=builder /usr/bin/pdftoppm /usr/bin/pdftoppm
          COPY --link --from=builder /usr/lib/x86_64-linux-gnu/libpoppler* /usr/lib/x86_64-linux-gnu/

          # Update paths so the OS knows where the transplanted Python and dependencies are
          ENV LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          ENV PYTHONPATH="/app/deps:/app"
          
          # Adding /app/deps/bin to PATH allows K8s Helm charts to just call "dagster"
          ENV PATH="/app/deps/bin:/usr/local/bin:$PATH"
          WORKDIR /app

          # Because we transplanted standard Python and env, we can use native commands
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "8080", "-m", "doc_tools.definitions"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max