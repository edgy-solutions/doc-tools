# Manufacturing work instructions expressed as a doc-type config.
# DESIGN SPIKE — see docs/engine-design-spike.md.
#
# This is the REFERENCE doc type: the wiring below reproduces the target
# (post-hybrid) manufacturing pipeline — deterministic blocks own the
# pattern/lookup/geometry/structural fields, the LLM owns judgment only,
# reconcile joins the arms per operation and emits the corpus report's diff
# classes, persistence is descriptor data.
#
# Patterns are inlined here for the spike's legibility. In production these
# reference the committed defaults in doc_tools/utils/mfg_extractors.py
# (DEFAULT_EXTRACTOR_CONFIG) with the same per-deployment override mechanism
# (MANUFACTURING_EXTRACTORS_SPEC) — one source of truth, not two.

doc_type: work-instructions
domain: manufacturing

ontology:
  prefix: mfg
  namespace: "http://edgy-solutions.com/ontology/mfg#"
  target_class: "mfg:WorkInstruction"

blocks:

  # ---- deterministic arm -------------------------------------------------
  operations:
    uses: structural.operations
    with:
      title_types: [Title]
      patterns: ['\bOperation\s+(\d{3,4})\b', '^\s*(\d{4})\b']

  standards:
    uses: regex.standards
    with:
      near_miss: '\b(MIL|J[\s\-]?STD|IPC|ISO|ASTM|AMS|NAS|STD|SPEC|MP)[\s\-]+(?![0-9])'
      families:
        - {canonical: MIL-PRF, pattern: 'MIL[\s\-]?PRF[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: MIL-STD, pattern: 'MIL[\s\-]?STD[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: MIL-DTL, pattern: 'MIL[\s\-]?DTL[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: J-STD,   pattern: 'J[\s\-]?STD[\s\-]?([0-9]{2,4}[A-Z0-9\-/]*)'}
        - {canonical: IPC,     pattern: 'IPC[\s\-]?([A-Z]?[0-9]{2,4}[A-Z0-9\-/]*)'}
        - {canonical: ISO,     pattern: 'ISO[\s\-]?([0-9]{3,5}[A-Z0-9\-/:]*)'}
        - {canonical: ASTM,    pattern: 'ASTM[\s\-]?([A-Z]?[0-9]{2,4}[A-Z0-9\-/]*)'}
        - {canonical: AMS,     pattern: 'AMS[\s\-]?([0-9]{3,5}[A-Z0-9\-/]*)'}
        - {canonical: NAS,     pattern: 'NAS[\s\-]?([0-9]{2,5}[A-Z0-9\-/]*)'}
        - {canonical: STD,     pattern: '\bSTD[\s\-]?([0-9]{3,5}[A-Z0-9\-/]*)'}
        - {canonical: SPEC,    pattern: '\bSPEC[\s\-]?([0-9]{3,5}[A-Z0-9\-/]*)'}
        - {canonical: MP,      pattern: '\bMP[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}

  parts:
    uses: regex.patterns
    with:
      patterns:
        - '\bPN[\s\-]?[0-9][0-9A-Z\-]{2,}\b'
        - '\bPART-[0-9]{3,}\b'
        - '\bASS?Y\.?\s*[0-9][0-9A-Z\-]{2,}\b'
        - '\bADH-[0-9]{2,}[0-9A-Z\-]*\b'

  slang:
    uses: gazetteer
    with:
      terms: [loctite, rtv, epoxy, zip tie, safety wire, hex nut, silicone,
              isopropyl alcohol, alcohol, ipa, anti-static foam, threadlocker, sealant]

  hazard:
    uses: regex.hazard
    with:
      pattern: '\bClass\s?([0-9]\.[0-9][A-Z]?)\b'
      lexicon: [ESD, static, explosive, hazmat, biohazard, FOD]

  durations:
    uses: parse.duration
    with:
      pattern: '\b([0-9]+(?:\.[0-9]+)?)\s*(min(?:ute)?s?|hours?|hrs?|days?)\b'
      to_minutes: {min: 1, minute: 1, minutes: 1, hr: 60, hrs: 60, hour: 60,
                   hours: 60, day: 1440, days: 1440}

  figures:
    uses: geometry.figure_binder
    with:
      same_page_only: true
      prefer: preceding
      marker_types: [Image, Figure]
      step_types: [NarrativeText, ListItem]

  # ---- LLM arm: judgment only, chunked by structure ----------------------
  judgment:
    uses: llm.extract
    needs: [operations]
    with:
      function: ExtractWorkInstructionJudgment   # the THIN schema — no spine fields
      chunking: structural                       # one call per operation span
      fields: [action_verb, is_value_added, is_safety_critical,
               process_category, justification]
      scope:
        prompt: manufacturing_instructions
        enums:
          process_category: [Transformation, Inspection, Movement, Rework,
                             Critical Safety Hold]
          hazard_class: ["1.1D", "1.3C", "Hazmat 3", "Biohazard"]
          personnel_role: [QC Inspector, Journeyman, Safety Officer]

  # ---- reconcile: join arms per unit, emit diff classes ------------------
  steps:
    uses: reconcile.units
    needs: [operations, standards, parts, slang, hazard, durations, figures, judgment]
    with:
      unit_source: operations
      llm_source: judgment
      det_fields:
        military_and_industry_standards: standards
        internal_part_numbers: parts
        material_and_hardware_slang: slang
        hazard_class: hazard
        estimated_duration_minutes: durations
        figure_references: figures
      scalar_fields: [hazard_class, estimated_duration_minutes]
      llm_fields: [action_verb, is_value_added, is_safety_critical,
                   process_category, justification]
      # Migration-mode instrumentation: fields the LLM still emits too, scored
      # with the corpus report's classes (agree / script_only / llm_only).
      # Empty once the thin schema ships and the LLM stops emitting them.
      double_armed: [military_and_industry_standards]

  # ---- persistence: descriptor data, never code --------------------------
  graph:
    uses: sink.graph_map
    needs: [steps]
    with:
      source: steps
      unit_label: ManufacturingStep
      ontology:
        prefix: mfg
        namespace: "http://edgy-solutions.com/ontology/mfg#"
        target_class: "mfg:WorkInstruction"
      fields:
        - {name: action_verb, cypher: attr, rdf: literal, predicate: hasAction}
        - {name: justification, cypher: attr, rdf: literal, predicate: hasJustification}
        - {name: is_value_added, cypher: attr, rdf: literal, predicate: isValueAdded}
        - {name: is_safety_critical, cypher: attr, rdf: literal, predicate: isSafetyCritical}
        - {name: process_category, cypher: attr, rdf: literal, predicate: hasProcessCategory}
        - {name: estimated_duration_minutes, cypher: attr, rdf: literal, predicate: estimatedDurationMinutes}
        - {name: military_and_industry_standards, cypher: related, label: Standard,
           rel_type: GOVERNED_BY, rdf: literal, predicate: governedBy}
        - {name: internal_part_numbers, cypher: related, label: Part,
           rel_type: REQUIRES_PART}
        - {name: material_and_hardware_slang, cypher: related, label: SlangTerm,
           rel_type: USABLE_SLANG}
        - {name: hazard_class, cypher: related, label: Hazard, rel_type: HAS_HAZARD,
           rdf: literal, predicate: hasHazardClass}
        - {name: figure_references, cypher: related, label: Figure,
           rel_type: REFERENCES_FIGURE}

  review:
    uses: sink.review_lane
    needs: [steps, graph]
    with: {}
