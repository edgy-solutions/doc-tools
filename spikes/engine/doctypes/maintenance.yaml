# Maintenance (MRO) as a DELTA over manufacturing — the clone thesis, made
# literal. DESIGN SPIKE — see docs/engine-design-spike.md.
#
# Everything not stated here is inherited: the operations/figures/parts/slang/
# hazard/durations wiring, the reconcile shape, the review lane. What changes
# is DATA: the standards families gain TM/FM/NSN, torque specs join the
# deterministic arm, the judgment schema swaps two fields, and the ontology
# targets mro#. If porting maintenance ever needs more than a file like this,
# the engine thesis is wrong — that is the falsifiable claim this file makes.

extends: manufacturing

doc_type: maintenance-procedures
domain: maintenance

ontology:
  prefix: mro
  namespace: "http://example.com/maintenance#"
  target_class: "mro:MaintenanceStep"

blocks:

  standards:
    with:
      # Manufacturing's families PLUS the military-manual families maintenance
      # documents cite. (Merged wholesale here because lists replace on merge —
      # deliberate: a family list is one reviewable unit, not a patch series.)
      near_miss: '\b(MIL|J[\s\-]?STD|IPC|ISO|ASTM|TM|FM|NSN|STD|SPEC)[\s\-]+(?![0-9])'
      families:
        - {canonical: MIL-PRF, pattern: 'MIL[\s\-]?PRF[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: MIL-STD, pattern: 'MIL[\s\-]?STD[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: MIL-DTL, pattern: 'MIL[\s\-]?DTL[\s\-]?([0-9]{3,6}[A-Z0-9\-/]*)'}
        - {canonical: J-STD,   pattern: 'J[\s\-]?STD[\s\-]?([0-9]{2,4}[A-Z0-9\-/]*)'}
        - {canonical: IPC,     pattern: 'IPC[\s\-]?([A-Z]?[0-9]{2,4}[A-Z0-9\-/]*)'}
        - {canonical: ISO,     pattern: 'ISO[\s\-]?([0-9]{3,5}[A-Z0-9\-/:]*)'}
        - {canonical: ASTM,    pattern: 'ASTM[\s\-]?([A-Z]?[0-9]{2,4}[A-Z0-9\-/]*)'}
        # Technical / field manuals: 'TM 9-1005-317-23' -> 'TM-9-1005-317-23'
        - {canonical: TM,      pattern: '\bTM[\s\-]?([0-9]{1,2}[\s\-][0-9]{3,4}[\s\-][0-9]{2,4}[A-Z0-9\-&P/]*)'}
        - {canonical: FM,      pattern: '\bFM[\s\-]?([0-9]{1,3}[\s\-][0-9]{1,4}[A-Z0-9\-/]*)'}
        # National stock numbers: 'NSN 1005-01-123-4567'
        - {canonical: NSN,     pattern: '\bNSN[\s:\-]?([0-9]{4}[\s\-]?[0-9]{2}[\s\-]?[0-9]{3}[\s\-]?[0-9]{4})'}

  # Torque specs are a pattern job, not a judgment call ('15 ft-lbs').
  torque:
    uses: regex.patterns
    with:
      patterns:
        - '\b[0-9]+(?:\.[0-9]+)?\s*(?:ft[\s\-]?lbs?|in[\s\-]?lbs?|Nm|N-m)\b'

  judgment:
    with:
      function: ExtractMaintenanceJudgment       # thin schema, MRO judgment fields
      fields: [action_verb, is_safety_critical, inspection_type,
               maintenance_level, justification]
      scope:
        prompt: maintenance_instructions
        enums:
          # null removes an inherited key (the loader's explicit-delete rule)
          process_category: null
          hazard_class: null
          personnel_role: null
          inspection_type: [Visual, Dimensional, NDI, Functional, Operational]
          maintenance_level: [Organizational, Direct Support, General Support, Depot]

  steps:
    with:
      det_fields:
        military_and_industry_standards: standards
        internal_part_numbers: parts
        material_and_hardware_slang: slang
        hazard_class: hazard
        estimated_duration_minutes: durations
        figure_references: figures
        torque_spec: torque
      scalar_fields: [hazard_class, estimated_duration_minutes, torque_spec]
      llm_fields: [action_verb, is_safety_critical, inspection_type,
                   maintenance_level, justification]
    # NB: `needs` merges shallowly per-key, so restate it with torque added.
    needs: [operations, standards, parts, slang, hazard, durations, figures,
            judgment, torque]

  graph:
    with:
      unit_label: MaintenanceStep
      ontology:
        prefix: mro
        namespace: "http://example.com/maintenance#"
        target_class: "mro:MaintenanceStep"
      fields:
        - {name: action_verb, cypher: attr, rdf: literal, predicate: hasAction}
        - {name: justification, cypher: attr, rdf: literal, predicate: hasJustification}
        - {name: is_safety_critical, cypher: attr, rdf: literal, predicate: isSafetyCritical}
        - {name: inspection_type, cypher: attr, rdf: literal, predicate: hasInspectionType}
        - {name: maintenance_level, cypher: attr, rdf: literal, predicate: hasMaintenanceLevel}
        - {name: torque_spec, cypher: attr, rdf: literal, predicate: hasTorqueSpec}
        - {name: estimated_duration_minutes, cypher: attr, rdf: literal, predicate: estimatedDurationMinutes}
        - {name: military_and_industry_standards, cypher: related, label: Standard,
           rel_type: GOVERNED_BY, rdf: literal, predicate: governedBy}
        - {name: internal_part_numbers, cypher: related, label: Part,
           rel_type: REQUIRES_PART}
        - {name: hazard_class, cypher: related, label: Hazard, rel_type: HAS_HAZARD,
           rdf: literal, predicate: hasHazardClass}
        - {name: figure_references, cypher: related, label: Figure,
           rel_type: REFERENCES_FIGURE}
