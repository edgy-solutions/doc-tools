# Default values for doc-tools.
replicaCount: 1

image:
  repository: ghcr.io/edgy-solutions/doc-tools
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
readinessProbe:
  httpGet:
    path: /
    port: 8080

# --- Custom App Configuration ---

# Secrets for the application (Neo4j, Weaviate, MinIO credentials)
secrets:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"
  WEAVIATE_URL: "http://weaviate:8080"
  WEAVIATE_API_KEY: ""
  JENA_URL: "http://jena-fuseki:3030/ds/update"
  JENA_USERNAME: "admin"
  JENA_PASSWORD: "password"

# Non-sensitive environment variables
env:
  S3_ENDPOINT_URL: "minio:9000"

# Dagster Run Configuration (config.yaml)
runConfig:
  sensors:
    - bucket: "processing-artifacts"
      directory: "manufacturing"
      config:
        ops:
          build_knowledge_graph:
            config:
              graph_node_label: "WorkInstruction"
              graph_child_label: "Page"
              vector_collection_name: "ManufacturingDocumentChunk"
    - bucket: "processing-artifacts"
      directory: "compliance"
      config:
        ops:
          build_knowledge_graph:
            config:
              graph_node_label: "RegulationDocument"
              graph_child_label: "Page"
              vector_collection_name: "ComplianceDocumentChunk"
    - bucket: "processing-artifacts"
      directory: "training"
      config:
        ops:
          build_knowledge_graph:
            config:
              graph_node_label: "Course"
              graph_child_label: "Slide"
              vector_collection_name: "TrainingDocumentChunk"

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
