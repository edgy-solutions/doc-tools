# - JENA_PASSWORD

# Proprietary manufacturing overlay fields (doc_tools/plugins/manufacturing_overlay.py).
# Defines extra extraction fields at runtime via a secret JSON spec WITHOUT committing
# them to the repo. When enabled, the JSON is mounted as a file and
# MANUFACTURING_OVERLAY_SPEC is set to <mountPath>/<secretKey>.
manufacturingOverlay:
  enabled: false
  # RECOMMENDED for prod: reference a Secret you created out-of-band so the
  # proprietary content never passes through Helm values or release history.
  existingSecret: ""
  # Key within the secret that holds the JSON document (also the mounted filename).
  secretKey: "manufacturing_overlay.json"
  mountPath: "/etc/doc-tools/overlay"
  # Dev-only convenience: inline JSON. If set (and existingSecret is empty) the chart
  # creates the secret from this. DO NOT commit real proprietary content here.
  spec: ""

autoscaling:
  enabled: false

# The PCN/PDN corpus release gate (scripts/pcn_corpus_gate.py, wrapped by
# templates/corpus-gate-cronjob.yaml). Each run is three SEQUENTIAL fires
# against a vision endpoint that serves one model at a time — roughly 70
# minutes end to end — so it is opt-in per environment, not on by default.
corpusGate:
  enabled: false
  schedule: "0 7 * * *"
  # Defaults live under /tmp in-cluster, NOT docs/corpus-gate: the image's
  # /app is not a git checkout, so a report written to a repo-shaped path in
  # the pod would still be a file in a container. The report leaves the pod
  # through the GitHub API instead — see publish below.
  workDir: /tmp/pcn-gate
  reportDir: /tmp/pcn-gate/report
  # What DOC_TOOLS_IMAGE is SUPPOSED to be, as `source=reference` entries. Any
  # mismatch makes the report VOID (verdict: void, exit 2) instead of a
  # verdict -- a score of the wrong image is not a worse score, it is not a
  # score. Comparison is on the sha256 digest, so registry spelling does not
  # matter; a tag-only reference on either side is `uncomparable`, which is
  # also void.
  #
  # DELIBERATELY EMPTY, and the chart MUST NOT fill in its own pin here.
  # Inside this CronJob, DOC_TOOLS_IMAGE and the container's `image:` both
  # render from `include "doc-tools.image" .`, which reads image.digest -- so
  # `chart=<that>` would compare a value with itself and report **match**
  # every time it ran. A check that cannot fail is worse than no check: it is
  # the `source_key` failure again, where a set-wide boolean read "verified"
  # across manifests the check was inert on.
  #
  # The comparison that carries information is the PODS' imageID, and the gate
  # cannot read it: this Job's ServiceAccount has no Role (there is no
  # role.yaml in templates/) and the image carries no kubectl. So it is
  # supplied from outside by whoever can read a pod:
  #
  #   --set corpusGate.expectImage="pods=ghcr.io/edgy-solutions/doc-tools@sha256:..."
  #
  # read off `kubectl get pod -o custom-columns=:status.containerStatuses[*].imageID`
  # -- imageID, NOT image, which since the digest pin reports a config digest
  # matching no image. Left empty, the run is UNRECONCILED and the report says
  # so in its own section; that is the absence of this check, not a pass of it.
  expectImage: ""
  # scripts/pcn_gate_publish.py commits the report to `branch` and keeps one
  # pull request open against `base`. It is deliberately inert out of the box:
  # `repo` empty means the step prints why it did nothing and the run still
  # succeeds. Turning it on needs TWO things, and one of them is not a chart
  # value — PCN_GATE_PUBLISH_TOKEN must be added to `secrets` as a token that
  # may PUSH to `repo`. That is strictly more privilege than the GIT_TOKEN
  # already in `secrets`, which only clones, so it is a separate key rather
  # than a reuse: whoever provisions it should see that they are granting
  # write access.
  #
  # NOT `main`. The report lands on a branch and a human merges it. `main` does
  # now require the `corpus-gate` check, but it requires NO APPROVING REVIEW, so
  # a machine pushing there would still be a final write with no human in front
  # of it -- and the gate's own report is the last thing that should land that
  # way.
  #
  # The merge must stay human for a second reason, learned the hard way on
  # 2026-10-01: tests/test_corpus_gate_guard.py asserts the committed report is
  # a PASS. So merging a FAIL report turns the required `corpus-gate` check red
  # on main and blocks every subsequent CHART PR -- including the next pin bump,
  # which is the one thing this gate exists to govern.
  #
  # CORRECTION, same day. I first wrote here that branch protection makes that
  # mechanical -- that a red report PR cannot merge because its own
  # `corpus-gate` run would be red. **That is false, and measured false on
  # PR #45:** `corpus-gate` reports `skipping`. The job is gated
  # `if: needs.changes.outputs.charts == 'true'` and a report PR touches only
  # docs/corpus-gate/**, so `charts=false` and the job never runs; a required
  # check that completes as `skipped` does NOT block. The skip is DELIBERATE --
  # scoping the gate to charts/** is what stops a red gate wedging the repo shut
  # against its own repair (see the job's comment in build-container.yml) -- so
  # it is working as designed, and the design simply does not include this
  # guarantee. Nothing mechanically prevents merging a red report. It is a human
  # rule: read `verdict` in the diff before merging. That is also precisely why
  # `base` is a PR target and not a push destination -- the human IS the control.
  #
  # TOKEN SCOPE, measured rather than assumed. The first real run proved the
  # provisioned PCN_GATE_PUBLISH_TOKEN can write CONTENTS but has no
  # `pull_requests: write`: the commit landed and the PR creation returned
  # HTTP 403 "Resource not accessible by personal access token". The publisher
  # REUSES an existing open PR, so once one exists the missing scope is not
  # fatal -- but grant it, or a future branch recreation needs a human again.
  publish:
    repo: ""
    branch: corpus-gate/nightly
    base: main
    path: docs/corpus-gate
  activeDeadlineSeconds: 21600
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
