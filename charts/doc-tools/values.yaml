# Default values for doc-tools.
replicaCount: 1

image:
  repository: ghcr.io/edgy-solutions/doc-tools
  pullPolicy: IfNotPresent
  # NO `tag` DEFAULT, DELIBERATELY. Every install must name the image it runs.
  # A default of "latest" made this file say the same word it said six months
  # ago, so no reader — and no `helm get values` — could answer "which code is
  # this?". CI publishes `:${{ github.sha }}` on every build, so an exact
  # identifier always exists; there is no reason to choose a mutable one.
  #
  # Omitting it here is only half the fix and is a FOOTGUN ON ITS OWN: it works
  # solely because templates/deployment.yaml uses `required`. It previously used
  # `| default .Chart.AppVersion`, which would have quietly filled this gap with
  # scaffold boilerplate. Do not reintroduce a default here, and do not relax
  # the `required` there — either alone restores the silent-substitution bug.
  #
  # Set it per environment: see values-sandbox.yaml.
  #
  # PREFER `digest` OVER `tag`. Added 2026-09-25, and the reason is narrower than
  # "digests are more precise": a tag is GUESSABLE FROM GIT and a digest is not.
  # `tag: <sha>` can be written by reading `git log`, which is precisely how an
  # image that was never built gets pinned — a commit whose `main` build failed
  # or was skipped still has a perfectly plausible-looking sha. That pin renders
  # cleanly, Helm reports success, and the pod lands in ImagePullBackOff minutes
  # later on a manifest-unknown, where it reads as a cluster fault. A digest
  # exists only as the output of a real push, so it cannot name an image that was
  # never pushed. See `doc-tools.image` in templates/_helpers.tpl.
  #
  #   digest: "sha256:<64 hex>"    # copy from the build-and-push job summary
  #
  # THE TAG PATH IS REFUSED BY DEFAULT. If you must pin by tag, confirm the tag
  # exists in the registry and then record that you did:
  #
  #   unverifiedTagAck: "https://github.com/edgy-solutions/doc-tools/actions/runs/<id>"
  #
  # That string is not decoration and the chart does not check it — Helm cannot
  # reach a registry at render time, so a human statement in a tracked file is
  # the only evidence a reviewer gets. Do not set it to "yes" or "ok"; the value
  # is supposed to be checkable by the next person.

# Dagster gRPC server for user code deployment.
# Override CMD from the distroless image (which defaults to webserver).
# Use explicit venv paths since distroless has no shell for PATH resolution.
# venv is at /opt/venv (NOT /app/venv): nltk >=3.10.1's CWE-427 import guard blocks
# imports resolving under the CWD, so a venv inside WORKDIR /app breaks nltk. Keep in
# lockstep with the Dockerfile in .github/workflows/build-container.yml.
command: ["/opt/venv/bin/python"]
args: ["/opt/venv/bin/dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "3030", "-m", "doc_tools.definitions"]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
readinessProbe:
  httpGet:
    path: /
    port: 8080

# --- Custom App Configuration ---

# Secrets for the application (Neo4j, Weaviate, MinIO credentials)
# These are mapped via templates/secret.yaml and injected via envFrom in deployment.yaml
secrets:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"
  WEAVIATE_HTTP_HOST: "weaviate:8080"
  WEAVIATE_GRPC_HOST: "weaviate-grpc:50051"
  WEAVIATE_API_KEY: ""
  JENA_URL: "http://jena-fuseki:3030"
  JENA_DS: "ds"
  JENA_USERNAME: "admin"
  JENA_PASSWORD: "password"
  DATAHUB_TOKEN: ""
  # CLONE credential, for the DataHub schema-ingestion assets. Read-only by
  # intent — do not widen it to cover the corpus gate's push, which has its
  # own key below for exactly that reason.
  GIT_TOKEN: ""
  # PUSH credential for the corpus gate's nightly report
  # (scripts/pcn_gate_publish.py, enabled by corpusGate.publish.repo). Empty
  # means the gate still runs and its report simply never leaves the pod.
  # Scope it to contents+pull-requests write on that ONE repo: it is the only
  # secret in this chart that can change the repository.
  PCN_GATE_PUBLISH_TOKEN: ""
  # svc:doc-tools' client-credentials secret. THE CLIENT IS CREATED BY A DIFFERENT CHART —
  # invincible-agent's realm import owns the realm (`serviceClients: iagent-doc-tools`), and this
  # value must MATCH `docToolsClientSecret` there. Two charts, one credential: nothing fails
  # loudly if they drift, because under OBSERVE a failed mint just logs and the call proceeds.
  # Empty here means semantic_linker mints nothing and engine-o records caller:none.
  DOC_TOOLS_CLIENT_SECRET: ""
  # Langfuse secret key. Placeholder: only used at runtime when PROMPT_SOURCE=langfuse.
  # doc-tools reads EnvVar("LANGFUSE_SECRET_KEY") unconditionally at Dagster run-build, so
  # it must exist even in file-mode (the prod default) or run-build fails "not set".
  LANGFUSE_SECRET_KEY: "sk-sandbox-placeholder"

# Non-sensitive environment variables
# These are injected via env in deployment.yaml
env:
  S3_ENDPOINT_URL: "minio:9000"
  DATAHUB_GMS_URL: "http://datahub-gms:8080/api/graphql"
  # doc-tools' ONE platform-facing endpoint. Declared here rather than left to the code default:
  # the previous default was the legacy `*-svc.default.svc.cluster.local` DNS, which does not
  # resolve in the current cluster, so this call had been pointing at a non-existent host
  # whenever the env var was unset — which is always, because it was never in this chart.
  ONTOLOGY_SERVICE_URL: "http://iagent-engine-o:8084"
  # Lane 1's stage route (`IngestStatusResource` -> `POST /ingest/{id}/stage`), svc:doc-tools.
  IAGENT_GATEWAY_URL: "http://iagent-cortex-bff:8090"
  # Transport identity for the call above (svc:doc-tools). The SECRET rides in `secrets:`.
  DOC_TOOLS_CLIENT_ID: "iagent-doc-tools"
  RAW_KAFKA_TOPIC: "openddil.sensor.data"
  DDS_GIT_REPO_URL: ""
  DDS_GIT_BRANCH: "main"
  DDS_SCHEMA_PATH: "schemas/dds"
  RABBITMQ_GIT_REPO_URL: ""
  RABBITMQ_GIT_BRANCH: "main"
  RABBITMQ_SCHEMA_PATH: "schemas/rabbitmq"
  # JENA_URL: "http://jena-fuseki:3030/ds" # Optional override
  # Prompt sourcing (doc_tools/plugins/base.py):
  #   "file"     -> canonical, git-committed prompts (prod default; no Langfuse at runtime)
  #   "langfuse" -> live Langfuse GUI at LANGFUSE_PROMPT_LABEL (dev/SME hot-tuning)
  PROMPT_SOURCE: "file"
  LANGFUSE_PROMPT_LABEL: "production"
  # Langfuse connection. Unused while PROMPT_SOURCE=file (no runtime Langfuse), but doc-tools
  # reads them at run-build so they must exist. Real values only needed for PROMPT_SOURCE=langfuse.
  LANGFUSE_PUBLIC_KEY: "pk-sandbox-placeholder"
  LANGFUSE_HOST: "http://langfuse.invalid:3000"
  # Trace provenance (ADR-0038). DEPLOY_ENV tags every trace with the cluster it ran
  # in; LANGFUSE_RELEASE is the deployed build — CI bakes the git SHA at image build
  # (left UNSET in-repo so os.getenv returns None and no empty release is stamped).
  DEPLOY_ENV: "sandbox"
  # LANGFUSE_RELEASE: "<git-sha>"   # set by CI / the deploy overlay

  # --- LLM endpoint (BAML client<llm> LLM in baml_src/main.baml) ---
  # The BAML client is provider="openai-generic", which speaks the OpenAI
  # Chat Completions wire protocol. Concretely covers Ollama / LiteLLM /
  # vLLM / OpenRouter / real OpenAI. Set LLM_BASE_URL to any one of:
  #
  #   Direct Ollama:    http://<ollama-host>:11434/v1
  #   LiteLLM proxy:    http://iagent-litellm:4000/v1   (iagent helm template)
  #   vLLM:             http://<vllm-host>:8000/v1
  #   Real OpenAI:      https://api.openai.com/v1      (LLM_API_KEY required)
  #   OpenRouter:       https://openrouter.ai/api/v1   (LLM_API_KEY required)
  #
  # LLM_API_KEY: empty for direct Ollama (header ignored), "any" for
  # stateless LiteLLM, real key for OpenAI / OpenRouter / authenticated
  # LiteLLM with a database_url. Default "any" works for the first two
  # and is harmless for direct Ollama.
  #
  # LLM_NUM_CTX is an Ollama-specific request option (passed through by
  # LiteLLM to Ollama; ignored by vLLM/OpenAI/OpenRouter). For vLLM,
  # configure context length via the vLLM server's --max-model-len at
  # deploy time.
  LLM_BASE_URL: "http://ollama:11434/v1"
  LLM_MODEL: "gpt-oss-128k:120b"
  LLM_NUM_CTX: "8192"
  LLM_API_KEY: "any"

  # --- Vision endpoint (BAML client<llm> Vision) for the PCN/PDN parts pass ---
  # Same openai-generic provider, configured INDEPENDENTLY of the text model so
  # it can point at a multimodal model. Covers Ollama gemma / LiteLLM / vLLM
  # (vision-capable model) / OpenAI. There is NO OPENAI_*->VISION_* alias, so set
  # all three explicitly. Images are sent as base64 — portable across every
  # backend. num_ctx is intentionally NOT a Vision option (vLLM fixes context via
  # --max-model-len; Ollama gemma sizes its own); the per-crop parts design keeps
  # each call small regardless.
  #
  #   LAN Ollama (gemma):  http://192.168.1.126:11434/v1  (ai1) / .169 (ai2)
  #   LiteLLM -> vLLM:     http://<litellm>:4000/v1  with VISION_LLM_MODEL an alias
  #
  # If VISION_LLM_BASE_URL is UNSET, the sustainment router SKIPS the vision
  # parts pass and flags the doc needs_review (header-only) — it never crashes.
  VISION_LLM_BASE_URL: "http://192.168.1.126:11434/v1"
  VISION_LLM_MODEL: "gemma4-32k:31b"
  VISION_LLM_API_KEY: "any"

  # --- Cropped-table render DPI (unstructured hi_res) for the vision pass ---
  # The DPI the Table/Image block crops are captured at. >=150 recommended;
  # raise if table text is small. Default 200.
  DOC_PARSER_PDF_IMAGE_DPI: "200"

  # --- Whole-page render DPI (pypdfium2) for the SUSTAINMENT second witness ---
  # Two readers, one raster. witness_regions cuts the header-block and
  # dates-block CROPS the header witness reads out of this image, and a crop
  # cannot be sharper than its source -- hence 300. _transcribe_pages_witness
  # also transcribes the whole page, for parts corroboration only; measured
  # 2026-10-01 that read is slightly better at 200 than at 300, so raising this
  # trades latency on the page call for detail in every crop. Must stay >=
  # DOC_PARSER_PDF_IMAGE_DPI. Written at INGEST, so a change here only takes
  # effect for documents ingested afterwards.
  DOC_PARSER_PAGE_RENDER_DPI: "300"

  # --- Embedding model for Weaviate vector writes/reads ---
  # doc-tools' semantic_assets.py and any other Weaviate writer
  # (doc_tools/utils/embed.py::embed_text) pull a vector from
  # LLM_BASE_URL/embeddings using this model name, then write
  # `vector=<computed>` to the Weaviate insert. NO server-side
  # text2vec module is involved — Weaviate is dumb storage.
  #
  # Must match invincible-agent/agent_fleet/utils/embed.py's default
  # and any LLM_EMBED_MODEL override set in the iagent chart that
  # populates the same collections. Cross-repo agreement on this
  # name is the contract.
  LLM_EMBED_MODEL: "nomic-embed-text"

# Additional environment variables from external Secrets or ConfigMaps
# Example block for required variables for the infrastructure team:
# extraEnvFrom:
