# values-sandbox.yaml — overrides for deploying doc-tools into the
# sandbox namespace of the iagent k3s cluster.
#
# Conventions in this cluster:
#   - All iagent backing services are prefixed `iagent-*` (no `iagent.`
#     subdomain). See `kubectl -n sandbox get svc | grep iagent`.
#   - DataHub GMS is under the `datahub-datahub-gms` LoadBalancer service.
#   - Neo4j password lives in `iagent-secrets`, base64-decoded from
#     `NEO4J_PASSWORD`. We inline it here for the doc-tools chart's
#     plain-secret shape; the iagent chart's helm release manages the
#     master secret. Swap to an external `extraEnvFrom` reference once
#     the chart adds one.

image:
  repository: ghcr.io/edgy-solutions/doc-tools
  # PINNED TO A SHA, NOT `latest`. THE TAG IS AN INSTRUCTION; THE SHA IS THE
  # DECLARATION. With `latest` this line said the same word it said six months
  # ago, so the tracked file declared NOTHING about which code was running and
  # `helm get values` could not answer "is this current?". Confirming a deployed
  # fix meant reading source inside a running pod — on 2026-09-12 that is
  # literally what it took: grepping /app/doc_tools/assets/aitool_linker.py:310
  # in the pod to discover the cluster was serving a writer two days older than
  # the fix, while the tag reported the same "latest" either way.
  #
  # NOTHING WAS MISSING TO MAKE THIS WORK. build-container.yml already pushes
  # BOTH tags on every build (`:latest` and `:${{ github.sha }}`) — an exact,
  # immutable identifier has existed for every commit all along and the
  # deployment chose the mutable one anyway. Framing that as absent
  # infrastructure is what keeps a one-line fix permanently unscheduled.
  #
  # RE-PIN ON EVERY DEPLOY. That is the real cost and it is deliberate: it is
  # the same cost the iagent chart already pays, and it buys "is it current?"
  # as a command instead of an archaeology exercise.
  # CORRECTION to 80866e9's message, which claimed the pod had been capped at
  # 2048. It had not. Revision 12 (2026-09-23 08:07:10) rolled this file 22
  # seconds after b11323e merged, so VISION_MAX_TOKENS=8192 went live then; what
  # revision 12 did NOT do is move the line below, so the pod kept running
  # 0279d83's code — which reads the cap from the environment and therefore
  # honoured 8192 all along. The cap has not moved since, and cannot explain a
  # score change at this or any later roll.
  #
  # PIN IS THE #12 MERGE, NOT THE #11 MERGE — and that is not a preference.
  # PRs #11 and #12 merged back to back on 2026-09-25. The #11 merge commit
  # (d7434d6) has NO IMAGE: #11 corrected the ground-truth denominator to 898
  # but left test_shipped_ground_truth_is_self_consistent asserting 896, so its
  # main build failed the `tests` job and `build-and-push` was skipped. #12
  # fixed that assert, so 600c454 is the first main sha since c460ac6 that has
  # an image at all. Pinning d7434d6 would have rendered perfectly here and then
  # died at the kubelet with ImagePullBackOff. Verify the tag exists in ghcr
  # before committing a pin; a green PR does not imply a built merge commit.
  #
  # THE 600c454 ROLL IS CLOSED, 2026-09-25. It read 897/898 at that pin, then
  # 898/898 after four notices were re-ingested in place -- four, not the five
  # predicted: TYC read stored=0 and already scored 26/26, so it had nothing to
  # fix. The crop seal came fully clean, stored_cut 0 (was 8). The long
  # prediction block that used to live here has served its purpose and is not
  # reproduced; docs/pcn-roll-600c454-2026-09-25.md is the record.
  #
  # IN PARTICULAR, THE PARAGRAPH HERE THAT SAID THE CROP-GEOMETRY REPAIR WAS
  # "STILL NOT NEW IN THE POD" IS NOW FALSE and has been removed rather than
  # left to age. The repair runs at INGEST, so it needed those re-ingests to
  # take effect -- and they have happened. Any future change to crop geometry
  # re-opens the same backlog, because the fix is still ingest-time.
  #
  # What IS new in the pod at 55a6292, over and above 600c454 (PRs #13 and #14):
  #   - sync_ontology_to_weaviate REFUSES a vectorless write that would strip a
  #     stored vector, rather than performing it. batch.add_object(uuid=...) is
  #     a whole-object PUT, so the old embed-failure fallback was not writing a
  #     thinner row -- it deleted a healthy vector on every re-drive that hit a
  #     gateway blip, undetectably. It now refuses AND RECORDS: a warning, plus
  #     rows_written / rows_written_without_vector /
  #     rows_refused_would_strip_vector in the asset's metadata. An ingest
  #     during an embed outage now records instead of destroying.
  #   - The chart refuses a pin it cannot show is real. This file is the first
  #     thing to use the digest path that change added.
  #   - From #14: the roll report and the re-ingest runbook, plus a tweak to
  #     scripts/pcn_crop_seal.py. NO EXTRACTION BEHAVIOUR CHANGED between
  #     600c454 and here, so the corpus is expected to read 898/898 UNCHANGED
  #     at this pin. A DIFFERENT number is a regression to investigate, not an
  #     improvement to celebrate -- there is nothing in this delta that could
  #     legitimately raise it.
  # PINNED BY DIGEST -- the first time this file has been, and the reason the
  # `tag` and `unverifiedTagAck` lines that stood here are gone rather than
  # merely updated. A tag is guessable from `git log`, which is exactly how
  # d7434d6 came to be pinned (see above); a digest exists only as the output of
  # a real push, so it cannot name an image that was never built. There is no
  # ack on this line because there is nothing left to attest to: the pin now
  # carries its own proof of build instead of a human promise that someone
  # checked.
  #
  # THIS IS THE INDEX (manifest-list) DIGEST, not a per-platform child.
  # Verified against ghcr before committing, by fetching the index itself from
  # ghcr.io/v2/edgy-solutions/doc-tools/manifests/sha256:72e725ca...:
  #     linux/amd64  sha256:d9d4e17b987d6d44c674d0e0f0e5344d5cecdade3abe342215e4b214446f0fe9
  #     linux/arm64  sha256:656d87dc065b571834d2f27dfe9136e8c0810693607c5f012233f3d57f47839c
  # Each child was then fetched by its own digest, not merely read out of the
  # index: both return 200 as OCI image manifests. A child can appear in the
  # index and still not be fetchable, which is the failure this check exists to
  # catch.
  #
  # THE arm64 CHILD IS THE ONE THAT MATTERS HERE and it must be checked on every
  # re-pin. Sandbox schedules onto arm workers, so an index whose arm64 child is
  # missing renders perfectly in Helm and then fails at the kubelet -- the same
  # failure SHAPE as the never-built tag, one layer further down, and not
  # something the chart guard can see. Helm validates that a digest is
  # well-formed; only the registry knows what is inside it.
  #
  # (The index also carries two unknown/unknown entries. Those are buildx
  # attestation manifests -- provenance and SBOM -- not platforms. Expected.)
  #
  # d630c28 is the #30 merge. Build run 36668129535:
  # https://github.com/edgy-solutions/doc-tools/actions/runs/36668129535
  # arm64 child verified on this index before rolling -- sha256:a11bb30a… beside
  # amd64 sha256:30fc1e44…, per the rule stated above.
  #
  # THE PIN THIS LINE REPLACED WAS NOT WHAT SANDBOX WAS RUNNING. The file said
  # 72e725ca (dbeb546, #24) while the release carried 7104b595 (the #26 merge)
  # from a `--set` override, so a plain `helm upgrade -f` against this file would
  # have rolled sandbox BACKWARD two merges. Bumping the file is also what
  # repairs that drift: image.digest was the ONLY key where the release and this
  # file diverged (all 18 env keys and every non-env key, imagePullSecrets
  # included, are declared here). If you ever pin by `--set` again, write it here
  # in the same breath or the next person's upgrade is a silent rollback.
  #
  # What the pin carries, CUMULATIVELY -- #19/#20/#22/#23/#24 arrived at dbeb546
  # and are still in; #26/#29/#30 are new at this pin. The numbers to watch:
  #   - #19 a DECLINED grid with no parts column now emits nothing rather than a
  #     guess. This is the one with a predicted number: `spur` was 1 on every
  #     fire of the previous pin (onsemi IPCN emitting `20kAlSiCu, 40kAlSi`, a
  #     string that is not a part), so `spur` should read 0 here. A score alone
  #     could never show this -- 898/898 was already true WITH the fabrication,
  #     because the score counts real parts found, not false ones emitted.
  #   - #20 the parts client decodes greedily (VisionBounded, temperature 0).
  #   - #22 crop geometry is row-bounded on all FOUR edges, not just the bottom,
  #     plus a text-layer repair for crops already stored. Watch stored_cut: the
  #     four-edge measurement on the previous pin read 15 tables / 37 words, of
  #     which left 11t/23w, top 4t/8w, right 3t/6w, bottom 0. The repair is
  #     INGEST-TIME, so those numbers move when the re-ingest runs, not here.
  #   - #23 the Jena writer scopes every update, so no plugin can write to the
  #     default graph where the mesh cannot see it.
  #   - #24 the header client is pinned at temperature 0 (HeaderBounded) AND a
  #     header value the document does not print is refused rather than flagged.
  #     Header agreement across fires is part of this gate, not just the parts
  #     count: the previous pin scored 898/898 three times while `mfr` flipped
  #     and one fire invented `TT Electronics` on a SEMELAB notice.
  #   - #26 text-layer damage is MEASURED per document and a damaged one is routed
  #     to a second (vision) witness. Exactly 1 of 9 notices is damaged
  #     (TYC-PCN-24-210412, whose font drops every `ti`). Watch `witness_pages` in
  #     stats: it is set from the witness index, and a 0 there means the witness
  #     was not built -- worth reading, but it does NOT by itself explain a bad
  #     parts number, which is what an earlier report wrongly inferred from it.
  #   - #29 the header-agreement instrument, committed rather than living in a
  #     scratchpad: parsed blocks bounded to their own region (one corrupt block
  #     used to hide eight notices), a field the log never yielded reported as
  #     NOT_MEASURED rather than None, and `--written` DECLINING on a degraded
  #     notice instead of replaying pre-witness trust logic and calling it
  #     product behaviour. Consequence to expect, not to be surprised by: TYC
  #     comes back NOT_MEASURED, which is a hole in the measurement and not a
  #     pass. A green `--written` covers 8 of 9 notices.
  #   - #30 `mfr` document-wins. The model nominates, the document decides: when
  #     the model's value is not printed on the page, the manufacturer is read off
  #     the document's own standalone heading. This is the one field that should
  #     stop flipping -- EOL-36 read 'SEMELAB' | '' | '' on the previous pin, and
  #     all five measured model answers for that notice now end at SEMELAB. It
  #     holds where the temperature pin could not BECAUSE it is document-anchored:
  #     temp 0 with a seed still yields three distinct outputs at the raw HTTP
  #     layer, so any field still taken from model free text (the `*_source`
  #     fields, TYC's `pub_date_source`) can and will still flip.
  #     THE TRAP: document-wins is gated OFF on a damaged text layer by an
  #     explicit `text_layer_degraded` argument. Ungated, it would read the
  #     misspelled `TE Connecvity` off TYC and write it in as a manufacturer.
  #   - #31 an uncorroborated-MPN flag now needs POSITIVE evidence: the key
  #     absent from the witness haystack AND a witness token strictly containing
  #     it as a subsequence 1-3 chars longer. Keys under 4 chars never qualify,
  #     and every finding carries `witness_value` so a flag can be checked
  #     against the page rather than believed. The rule underneath it is that
  #     ABSENCE FROM THE WITNESS IS NEVER EVIDENCE ON ITS OWN -- vision
  #     substitutes digits, so non-containment cannot be a finding. The number:
  #     the old test raised 9 false positives on TYC, a notice already 898/898
  #     exact with 0 spurious / 0 missing / 0 malformed. Expect those 9 gone.
  #   - #32 the LTB RECALL fix, and it is a different defect class from
  #     everything above it. `refuse_unsourced_header_values` is a FILTER, so it
  #     can only ever fix PRECISION -- a `None` is not refusable. Diodes Rev1's
  #     `doc_level_ltb_date` read None | None | '2024-12-22' at the previous pin,
  #     and fire 3's value survived the refusal with `refusals: 0`, so the date
  #     is REAL and the two Nones are MISSES that no amount of trust logic could
  #     supply. `doc_tools/utils/ltb_candidates.py` now scrapes candidate dates
  #     off the text layer near a last-time-buy phrase and the model only CHOOSES
  #     from that list, or returns null.
  #     WHAT TO WATCH, and it is not the score: the model picking the last-SHIP
  #     date `2025-06-11` over the last-order date `2024-12-22`. Every LTB
  #     sentence in this corpus states BOTH in the same window, and both are
  #     offered as candidates deliberately -- filtering the ship date by regex
  #     would be guessing. The `governing` field (the text immediately before
  #     each date, where `last order date of` vs `last ship date of` lives) is
  #     the mitigation, but it is GUIDANCE, NOT ENFORCEMENT. If a fire picks the
  #     ship date, fix the candidate block's WORDING, not the regex.
  #     Read the value out by VALUE, never from an "agree" verdict: three fires
  #     can agree on None, which is exactly the bug. EOL-36 must stay null -- it
  #     prints "last time buy" with no date near it, the zero-candidate case.
  #     ALSO, AND IT IS WHY THE RUNBOOK GREW A CHECK 0: this is the change that
  #     makes the re-ingest stop being idempotent. `reconcile_ltb` falls back to
  #     the doc-level date, so every Diodes Rev1 part row lacking its own LTB
  #     date will be REWRITTEN with 2024-12-22. Intended, and it does NOT move
  #     the parts score (that score is MPN-only), but the stored artifacts will
  #     differ from what is in S3 today and there is no rollback for them.
