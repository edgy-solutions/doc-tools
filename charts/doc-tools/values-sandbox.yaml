# values-sandbox.yaml — overrides for deploying doc-tools into the
# sandbox namespace of the iagent k3s cluster.
#
# Conventions in this cluster:
#   - All iagent backing services are prefixed `iagent-*` (no `iagent.`
#     subdomain). See `kubectl -n sandbox get svc | grep iagent`.
#   - DataHub GMS is under the `datahub-datahub-gms` LoadBalancer service.
#   - Neo4j password lives in `iagent-secrets`, base64-decoded from
#     `NEO4J_PASSWORD`. We inline it here for the doc-tools chart's
#     plain-secret shape; the iagent chart's helm release manages the
#     master secret. Swap to an external `extraEnvFrom` reference once
#     the chart adds one.

image:
  repository: ghcr.io/edgy-solutions/doc-tools
  # PINNED TO A SHA, NOT `latest`. THE TAG IS AN INSTRUCTION; THE SHA IS THE
  # DECLARATION. With `latest` this line said the same word it said six months
  # ago, so the tracked file declared NOTHING about which code was running and
  # `helm get values` could not answer "is this current?". Confirming a deployed
  # fix meant reading source inside a running pod — on 2026-09-12 that is
  # literally what it took: grepping /app/doc_tools/assets/aitool_linker.py:310
  # in the pod to discover the cluster was serving a writer two days older than
  # the fix, while the tag reported the same "latest" either way.
  #
  # NOTHING WAS MISSING TO MAKE THIS WORK. build-container.yml already pushes
  # BOTH tags on every build (`:latest` and `:${{ github.sha }}`) — an exact,
  # immutable identifier has existed for every commit all along and the
  # deployment chose the mutable one anyway. Framing that as absent
  # infrastructure is what keeps a one-line fix permanently unscheduled.
  #
  # RE-PIN ON EVERY DEPLOY. That is the real cost and it is deliberate: it is
  # the same cost the iagent chart already pays, and it buys "is it current?"
  # as a command instead of an archaeology exercise.
  # CORRECTION to 80866e9's message, which claimed the pod had been capped at
  # 2048. It had not. Revision 12 (2026-09-23 08:07:10) rolled this file 22
  # seconds after b11323e merged, so VISION_MAX_TOKENS=8192 went live then; what
  # revision 12 did NOT do is move the line below, so the pod kept running
  # 0279d83's code — which reads the cap from the environment and therefore
  # honoured 8192 all along. The cap is not new here and cannot explain a score
  # change at this roll.
  #
  # What IS new in the pod at dc12ef3: b11323e's truncation/near-cap ACCOUNTING
  # (the code that reports the cap being approached, as opposed to the cap
  # itself), and 11fdb67's row-count detector and text-only vision route. Of
  # those, only the router can add an extracted part; the two detectors can only
  # raise needs_review, so they move the score down if they move it at all.
  tag: "dc12ef306c96a5c43afb3e0534fc3a7896ca3d53"
  # `Always` retained DELIBERATELY. With a sha tag it is no longer necessary
  # (the tag is immutable) but it is harmless, and changing it in the same edit
  # would give a rollback two variables instead of one. Drop it in a separate
  # change if ever wanted. CI publishes multi-arch (linux/amd64 + linux/arm64)
  # per build-container.yml so arm nodes (worker1, worker6) get the right binary.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

# The deployment runs `dagster api grpc -h 0.0.0.0 -p 3030` (a Dagster
# code-location server). The chart's default httpGet probes against
# port 8080 / `/` will FAIL because the workload is gRPC on 3030, not
# HTTP. Disable them — Dagster's daemon will discover the grpc server
# via its own health check once doc-tools is added as a code location.
livenessProbe: null
readinessProbe: null

# Cluster service endpoints. NEO4J / WEAVIATE / MinIO / Fuseki all live
# in `sandbox` namespace under their iagent-* names.
secrets:
  NEO4J_URI: "bolt://iagent-neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "changeme-neo4j-sandbox"
  WEAVIATE_HTTP_HOST: "iagent-weaviate"
  WEAVIATE_GRPC_HOST: "iagent-weaviate-grpc"
  WEAVIATE_API_KEY: ""
  # Match what `kubectl -n sandbox get statefulset iagent-minio
  # -o yaml | grep MINIO_ROOT` reports for this cluster's MinIO. The
  # chart's defaults (minioadmin/minioadmin) are MinIO's stock root
  # creds but this sandbox uses a different root user/pass, so
  # doc-tools' boto/aws-sdk calls would 403 against them.
  AWS_ACCESS_KEY_ID: "minio-sandbox"
  AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
  JENA_URL: "http://iagent-fuseki:3030"
  JENA_DS: "ds"
  JENA_USERNAME: "admin"
  JENA_PASSWORD: ""
  DATAHUB_TOKEN: ""
  GIT_TOKEN: ""
  # Must MATCH `docToolsClientSecret` in invincible-agent's values (sandbox default below).
  # The realm import there creates the `iagent-doc-tools` client with this secret; if the two
  # drift, the mint fails, logs, and the call proceeds unauthenticated — silently, under OBSERVE.
  DOC_TOOLS_CLIENT_SECRET: "sandbox-doc-tools-secret"

env:
  S3_ENDPOINT_URL: "http://iagent-minio:9000"
  # doc-tools' only platform-facing call. Sandbox release name is `iagent`.
  ONTOLOGY_SERVICE_URL: "http://iagent-engine-o:8084"
  DOC_TOOLS_CLIENT_ID: "iagent-doc-tools"
  DATAHUB_GMS_URL: "http://datahub-datahub-gms:8080/api/graphql"
  # The Weaviate-host envvars above are split host/port; some code
  # paths in doc-tools may want a single URL — keep this as the
  # canonical fallback shape.
  WEAVIATE_HTTP_PORT: "8080"
  WEAVIATE_GRPC_PORT: "50051"

  # Sandbox default: route doc-tools' BAML extraction DIRECTLY at the dev
  # ai1 Ollama (192.168.1.126) — the same host iagent's agents and doc-tools'
  # VISION endpoint already use, serving gpt-oss-128k:120b. LiteLLM is NOT
  # deployed in the default sandbox (only in the litellm-rehearsal scenario:
  # invincible-agent values-sandbox-litellm-rehearsal.yaml, litellm.enabled=
  # true), so pointing at iagent-litellm:4000 here fails DNS. At WORK (or in
  # the rehearsal), override this back to the LiteLLM proxy
  # (http://iagent-litellm:4000/v1) — the chart supports both; only this URL
  # differs. Stateless → any non-empty api_key works.
  LLM_BASE_URL: "http://192.168.1.126:11434/v1"
  LLM_MODEL: "gpt-oss-128k:120b"
  LLM_NUM_CTX: "8192"
  LLM_API_KEY: "any"
  # Embedding model — must match the iagent rehearsal overlay value.
  # Cross-repo agreement on this name is the contract.
  LLM_EMBED_MODEL: "nomic-embed-text"

  # Vision (gemma) endpoint for the PCN/PDN parts pass.
  # Keep this on a DIFFERENT box than LLM_BASE_URL so the 120B header model and
  # the gemma vision model do not compete for one card's memory:
  #   header  (gpt-oss 120B) -> ai1  .126        (LLM_BASE_URL above)
  #   vision  (gemma4-32k)   -> .169:11434       (this block)
  # .169:11434 is a 32 GB discrete Radeon PRO R9700 (endpoint "C" in
  # ~/git/gpu-servers.md), NOT the ai2 Strix Halo — ai2 answered on this port
  # until 2026-09-20 and now answers on :11435. Do not compare runs across that
  # date. C is shared with iagent and the goatyardarchive coding agent and holds
  # ONE large model at a time, so batch test runs by model.
  # NOTE: .188 is only the OpenWebUI *frontend* (proxies to .169); its own
  # Ollama at :11434 has no model -> 404. Point at .169 directly.
  VISION_LLM_BASE_URL: "http://192.168.1.169:11434/v1"
  VISION_LLM_MODEL: "gemma4-32k:31b"
  VISION_LLM_API_KEY: "any"

  # Output bound for the vision parts pass. Caps GENERATED tokens only; it is
  # unrelated to the model's 32k context window (which the `-32k` in the model
  # name selects, and which num_ctx cannot change over the OpenAI-compatible
  # /v1 path BAML speaks).
  #
  # Measured on 0279d83 against this endpoint, 2026-09-22 — the two densest
  # crops in the corpus emit 2,840 and 3,472 output tokens. The old code
  # default of 2048 cut both off; BAML fails OPEN on truncation, so the crops
  # were discarded and PCN23-002 returned 0 of 18 parts while
  # onsemi_Generic_IPCN25300X returned 2 of 19. At 4096 both complete
  # (17/18 and 19/19), but 3,472 is 85% of 4096 and overrun is SILENT part
  # loss, so this is set well clear of the measured ceiling rather than just
  # above it. A ceiling is not a reservation: a short answer still costs only
  # what it emits.
  #
  # The corpus was then re-run at 32768, where the cap cannot bind, to measure
  # the model instead of the bound: the densest of 15 crops emitted 2,723
  # tokens and the whole corpus reached 894/896. Nothing here wants more than
  # ~3,500 tokens even when offered 32k, and no crop ran away (longest 131s,
  # against a 600s timeout). 8192 is therefore ~2.4x the largest emission ever
  # observed, with the run-to-run variance (~20%) covered.
  #
  # Upper bound is the per-call timeout, not the context window: at the
  # measured 17-21 tok/s, 8192 tokens is ~400-480s against the 600s
  # LLM_REQUEST_TIMEOUT_MS default. Raising this much further trades a
  # DETECTED truncation for an undetected timeout.
  VISION_MAX_TOKENS: "8192"

# Doc-tools' unstructured/PDF pipeline is memory-heavy (table parser,
# layout model, image extraction). Conservative starting point; will
# need tuning after the first PDF run.
resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "500m"
    memory: 2Gi

# Service still defined on port 8080 even though the workload is on
# 3030 — leave the default; this lets the chart create the Service
# resource, and the dagster integration step (which we're not doing
# in this commit) can update the spec or add a second port.
service:
  type: ClusterIP
  port: 3030

ingress:
  enabled: false

autoscaling:
  enabled: false
