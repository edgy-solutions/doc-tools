  # A green `build-and-push` is NOT evidence an image exists: that step is
  # gated `push: ${{ github.event_name != 'pull_request' }}`, so PR runs build
  # both architectures as a compile check and publish nothing. This digest comes
  # from the `push`-event run on main (36942763463), which does publish.
  #
  # INDEX VERIFIED BEFORE COMMITTING, children fetched BY THEIR OWN DIGEST
  # rather than merely read out of the index:
  #     linux/amd64  sha256:be02ce80235b72df7d33213df97306beb78a3d189659fa4c19ba4fdee31dce86
  #     linux/arm64  sha256:f77400502c12bfc647094747c67853fb01b1ec0c5d0033b2c6edd007393b7eb1
  # Both return 200 as OCI image manifests. The arm64 child is the one that
  # matters -- sandbox schedules onto arm workers. (Two unknown/unknown entries
  # are buildx provenance/SBOM attestations. Expected.)
  # ------------------------------------------------------------------
  #
  # PREVIOUS PIN, kept for the rollback target and the reasoning behind it:
  # db2d863 (the #40 squash merge), 2026-10-01,
  # sha256:cec58b3a06592a90fa310fff17d57b6789a643a5f783ab09460092948932e609.
  #
  # WHY IT MOVED, and this one is not an optimization. The previous pin
  # (904fb458) DOES NOT CONTAIN scripts/pcn_gate_publish.py -- checked in the
  # running pod, `ls /app/scripts/pcn_gate_publish.py` -> No such file. #40
  # merged `corpusGate.enabled: true` (right above) WITHOUT moving this pin, so
  # as committed, main scheduled a 70-minute nightly run that measures the
  # corpus correctly, then dies at the publish step with the report still inside
  # the container. Enabled-plus-stale-pin is the broken combination this fixes;
  # the two must move together.
  #
  # IT IS A MERGE COMMIT, which the pin it replaces was not. An interim pin at
  # 4c1f74cc (branch head fa19b85, cut via workflow_dispatch) was rolled into
  # sandbox at 00:53 UTC to get a publisher in front of the 07:00 run before #40
  # had landed; that commit never reached main. This supersedes it and restores
  # the normal rule: PIN MERGE COMMITS ONLY.
  #
  # Beyond the publisher, db2d863 also carries what the branch image did not:
  # #39 (dotted revisions order numerically) and #41 (iagent-mesh v0.9.5).
  # #39 touches notice_identity, so a corpus score from this pin is not
  # automatically comparable to one from 4c1f74cc -- the first nightly on this
  # pin is a NEW baseline, not a repeat.
  #
  # A green `build-and-push` is NOT evidence an image exists: that step is
  # gated `push: ${{ github.event_name != 'pull_request' }}`, so PR runs build
  # both architectures as a compile check and publish nothing. This digest comes
  # from the `push`-event run on main (36815972470), which does publish.
  #
  # Its index was verified the same way, children fetched by their own digest:
  #     linux/amd64  sha256:0e1c5614dcef3e542f7dd265002f8502ace8b071c3ee5f211d5f9faf1e538763
  #     linux/arm64  sha256:a717e818d51f659caabe56c7657590fa1e4abdf63ba507917b609c7069e3d292
  # ------------------------------------------------------------------
  digest: "sha256:b54d9ef2a1fdc871beb31b7ccbede7a59c43489133f9bad890cb8fce63fc0a21"
  # `Always` retained DELIBERATELY. Against a digest it is not merely
  # unnecessary but inert -- a digest names exactly one immutable object, so
  # there is nothing a re-pull could fetch differently. It stays because
  # changing it in the same edit that changes the pin would give a rollback two
  # variables instead of one. Drop it in a separate
  # change if ever wanted. CI publishes multi-arch (linux/amd64 + linux/arm64)
  # per build-container.yml so arm nodes (worker1, worker6) get the right binary.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

# The deployment runs `dagster api grpc -h 0.0.0.0 -p 3030` (a Dagster
# code-location server). The chart's default httpGet probes against
# port 8080 / `/` will FAIL because the workload is gRPC on 3030, not
# HTTP. Disable them — Dagster's daemon will discover the grpc server
# via its own health check once doc-tools is added as a code location.
livenessProbe: null
readinessProbe: null

# Cluster service endpoints. NEO4J / WEAVIATE / MinIO / Fuseki all live
# in `sandbox` namespace under their iagent-* names.
secrets:
  NEO4J_URI: "bolt://iagent-neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "changeme-neo4j-sandbox"
  WEAVIATE_HTTP_HOST: "iagent-weaviate"
  WEAVIATE_GRPC_HOST: "iagent-weaviate-grpc"
  WEAVIATE_API_KEY: ""
  # Match what `kubectl -n sandbox get statefulset iagent-minio
  # -o yaml | grep MINIO_ROOT` reports for this cluster's MinIO. The
  # chart's defaults (minioadmin/minioadmin) are MinIO's stock root
  # creds but this sandbox uses a different root user/pass, so
  # doc-tools' boto/aws-sdk calls would 403 against them.
  AWS_ACCESS_KEY_ID: "minio-sandbox"
  AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
  JENA_URL: "http://iagent-fuseki:3030"
  JENA_DS: "ds"
  JENA_USERNAME: "admin"
  JENA_PASSWORD: ""
  DATAHUB_TOKEN: ""
  GIT_TOKEN: ""
  # Must MATCH `docToolsClientSecret` in invincible-agent's values (sandbox default below).
  # The realm import there creates the `iagent-doc-tools` client with this secret; if the two
  # drift, the mint fails, logs, and the call proceeds unauthenticated — silently, under OBSERVE.
  DOC_TOOLS_CLIENT_SECRET: "sandbox-doc-tools-secret"

env:
  S3_ENDPOINT_URL: "http://iagent-minio:9000"
  # doc-tools' only platform-facing call. Sandbox release name is `iagent`.
  ONTOLOGY_SERVICE_URL: "http://iagent-engine-o:8084"
  DOC_TOOLS_CLIENT_ID: "iagent-doc-tools"
  DATAHUB_GMS_URL: "http://datahub-datahub-gms:8080/api/graphql"
  # The Weaviate-host envvars above are split host/port; some code
  # paths in doc-tools may want a single URL — keep this as the
  # canonical fallback shape.
  WEAVIATE_HTTP_PORT: "8080"
  WEAVIATE_GRPC_PORT: "50051"

  # Sandbox default: route doc-tools' BAML extraction DIRECTLY at the dev
  # ai1 Ollama (192.168.1.126) — the same host iagent's agents and doc-tools'
  # VISION endpoint already use, serving gpt-oss-128k:120b. LiteLLM is NOT
  # deployed in the default sandbox (only in the litellm-rehearsal scenario:
  # invincible-agent values-sandbox-litellm-rehearsal.yaml, litellm.enabled=
  # true), so pointing at iagent-litellm:4000 here fails DNS. At WORK (or in
  # the rehearsal), override this back to the LiteLLM proxy
  # (http://iagent-litellm:4000/v1) — the chart supports both; only this URL
  # differs. Stateless → any non-empty api_key works.
  LLM_BASE_URL: "http://192.168.1.126:11434/v1"
  LLM_MODEL: "gpt-oss-128k:120b"
  LLM_NUM_CTX: "8192"
  LLM_API_KEY: "any"
  # Embedding model — must match the iagent rehearsal overlay value.
  # Cross-repo agreement on this name is the contract.
  LLM_EMBED_MODEL: "nomic-embed-text"

  # Vision (gemma) endpoint for the PCN/PDN parts pass.
  # Keep this on a DIFFERENT box than LLM_BASE_URL so the 120B header model and
  # the gemma vision model do not compete for one card's memory:
  #   header  (gpt-oss 120B) -> ai1  .126        (LLM_BASE_URL above)
  #   vision  (gemma4-32k)   -> .169:11434       (this block)
  # .169:11434 is a 32 GB discrete Radeon PRO R9700 (endpoint "C" in
  # ~/git/gpu-servers.md), NOT the ai2 Strix Halo — ai2 answered on this port
  # until 2026-09-20 and now answers on :11435. Do not compare runs across that
  # date. C is shared with iagent and the goatyardarchive coding agent and holds
  # ONE large model at a time, so batch test runs by model.
  # NOTE: .188 is only the OpenWebUI *frontend* (proxies to .169); its own
  # Ollama at :11434 has no model -> 404. Point at .169 directly.
  VISION_LLM_BASE_URL: "http://192.168.1.169:11434/v1"
  VISION_LLM_MODEL: "gemma4-32k:31b"
  VISION_LLM_API_KEY: "any"

  # Output bound for the vision parts pass. Caps GENERATED tokens only; it is
  # unrelated to the model's 32k context window (which the `-32k` in the model
  # name selects, and which num_ctx cannot change over the OpenAI-compatible
  # /v1 path BAML speaks).
  #
  # Measured on 0279d83 against this endpoint, 2026-09-22 — the two densest
  # crops in the corpus emit 2,840 and 3,472 output tokens. The old code
  # default of 2048 cut both off; BAML fails OPEN on truncation, so the crops
  # were discarded and PCN23-002 returned 0 of 18 parts while
  # onsemi_Generic_IPCN25300X returned 2 of 19. At 4096 both complete
  # (17/18 and 19/19), but 3,472 is 85% of 4096 and overrun is SILENT part
  # loss, so this is set well clear of the measured ceiling rather than just
  # above it. A ceiling is not a reservation: a short answer still costs only
  # what it emits.
  #
  # The corpus was then re-run at 32768, where the cap cannot bind, to measure
  # the model instead of the bound: the densest of 15 crops emitted 2,723
  # tokens and the whole corpus reached 894/896. Nothing here wants more than
  # ~3,500 tokens even when offered 32k, and no crop ran away (longest 131s,
  # against a 600s timeout). 8192 is therefore ~2.4x the largest emission ever
  # observed, with the run-to-run variance (~20%) covered.
  #
  # Upper bound is the per-call timeout, not the context window: at the
  # measured 17-21 tok/s, 8192 tokens is ~400-480s against the 600s
  # LLM_REQUEST_TIMEOUT_MS default. Raising this much further trades a
  # DETECTED truncation for an undetected timeout.
  VISION_MAX_TOKENS: "8192"

# Doc-tools' unstructured/PDF pipeline is memory-heavy (table parser,
# layout model, image extraction). Conservative starting point; will
# need tuning after the first PDF run.
resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "500m"
    memory: 2Gi

# Service still defined on port 8080 even though the workload is on
# 3030 — leave the default; this lets the chart create the Service
# resource, and the dagster integration step (which we're not doing
# in this commit) can update the spec or add a second port.
service:
  type: ClusterIP
  port: 3030

ingress:
  enabled: false

autoscaling:
  enabled: false

# The PCN/PDN corpus release gate. OFF in the chart default and turned on here,
# for sandbox only, because this is the cluster that has the vision endpoint the
# three fires need. Budget the cost before copying this block elsewhere: each
# run is three SEQUENTIAL fires against an endpoint that serves one model at a
# time, which measured 1397s / 1351s / 1321s at this pin -- about 70 minutes of
# GPU per night, every night, at 07:00 UTC.
#
# publish.repo is set, which is the SECOND of the two things the publish step
# needs. The first is PCN_GATE_PUBLISH_TOKEN, and it is deliberately NOT here:
# it is a push credential and lives in values-sandbox.secret.yaml under
# `secrets:`, so it renders into the chart's Opaque Secret rather than inline as
# a `value:` in the CronJob and Deployment manifests. With the token missing the
# gate still RUNS and still reports its verdict -- it just prints why it
# published nothing, and the Job stays green. A publish problem cannot paint a
# red corpus green.
#
# base stays `main` and branch stays the chart default: the report lands on
# corpus-gate/nightly and a human merges it. Note that the comment in
# values.yaml justifying this with "no required checks on main" is now stale --
# main IS protected and corpus-gate IS required as of 2026-09-30 -- but the
# conclusion is unchanged, because a nightly machine commit should be reviewed
# on its own merits and not merely be check-green.
corpusGate:
  enabled: true
  # WHAT THE GATE'S measured_image WAS SUPPOSED TO BE, so #55's VOID ruling has
  # something to fire on. Before this line the gate ran UNRECONCILED, which is
  # the ABSENCE of the check and not a pass of it.
  #
  # THIS VALUE WAS READ OFF A POD, NOT COPIED FROM image.digest ABOVE. That
  # distinction is the whole point: DOC_TOOLS_IMAGE and the gate container's
  # `image:` both render from `include "doc-tools.image" .`, so a `chart=`
  # expectation would compare a value with itself and report match every time it
  # ran -- a check that cannot fail, which is worse than no check (the
  # `source_key` lesson, where a set-wide boolean read "verified" across
  # manifests the check was inert on). The question that carries information is
  # whether the PODS rolled, and only the pods can answer it.
  #
  # Read after the helm revision 30 roll, with:
  #   kubectl get pods -n sandbox -l app.kubernetes.io/name=doc-tools \
  #     -o custom-columns=:status.containerStatuses[*].imageID
  # imageID, NOT image -- since the digest pin, `image` reports a config digest
  # that matches no image in the registry. Pod: doc-tools-67b8dcc99b-pzb9h
  #
  # It agrees with image.digest above, and that agreement is a RESULT rather
  # than a construction: the two values came from different places and could
  # have differed, which is exactly the drift found on 2026-10-01 when the
  # chart said cec58b3a and the pod ran 4c1f74cc.
  #
  # IT MUST BE RE-READ ON EVERY PIN BUMP. A stale expectation does not fail
  # safe: it will VOID an otherwise good run by naming the previous image. Bump
  # image.digest and this line in the same commit, and read this one off a pod
  # after the roll -- never by copying the digest you just typed above.
  expectImage: "pods=ghcr.io/edgy-solutions/doc-tools@sha256:b54d9ef2a1fdc871beb31b7ccbede7a59c43489133f9bad890cb8fce63fc0a21"
  publish:
    repo: edgy-solutions/doc-tools
