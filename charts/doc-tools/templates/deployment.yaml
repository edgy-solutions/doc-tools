apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doc-tools.fullname" . }}
  labels:
    {{- include "doc-tools.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doc-tools.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "doc-tools.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "doc-tools.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{/*
            `required`, NOT `| default`. The previous form silently substituted
            .Chart.AppVersion for an unset tag — and that value was untouched
            `helm create` scaffolding ("1.16.0"), an image that has never been
            published and CANNOT be: CI's tag set is closed to `latest`, a `v*`
            git tag, and the commit sha, and "1.16.0" matches none of them. So
            "remove the default from values.yaml" — the obvious fix — would have
            swapped a MUTABLE pull for a NONEXISTENT one, surfacing as an
            ImagePullBackOff on the cluster at deploy time, on a tag no human
            chose, while values.yaml looked exactly as specified.

            A `| default` is the same move as a `.get(key, "")`: it manufactures
            a plausible value where an absence should have stopped something.
            Failing at RENDER is the point — the error arrives before anything
            is applied, and names its own remedy.
          */}}
          # Built by doc-tools.image (_helpers.tpl), which REFUSES a pin that
          # cannot be shown to exist. The `required` that used to live inline
          # here caught an ABSENT tag but not a never-built one — see that
          # helper for the d7434d6 incident and for why a digest is the only
          # pin that carries its own proof of build.
          image: {{ include "doc-tools.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "doc-tools.fullname" . }}-secrets
            {{- if .Values.extraEnvFrom }}
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
            {{- end }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if .Values.manufacturingOverlay.enabled }}
            - name: MANUFACTURING_OVERLAY_SPEC
              value: {{ printf "%s/%s" .Values.manufacturingOverlay.mountPath .Values.manufacturingOverlay.secretKey | quote }}
            {{- end }}
            # THIS DEPLOYMENT IS THE DAGSTER CODE LOCATION, so an ingest row's
            # `pin_digest` is stamped by this pod — and without this variable the
            # stamp fell back to a git sha, which names source and not the image
            # that actually ran. The corpus-gate CronJob has carried
            # DOC_TOOLS_IMAGE since it was added; the Deployment never did, so
            # every ingest wrote a weaker provenance than the nightly gate.
            #
            # Rendered from the SAME `include "doc-tools.image" .` as this
            # container's `image:` above, so the two cannot disagree: there is no
            # second place to update and no way to stamp a digest the pod is not
            # running.
            #
            # DELIBERATELY AFTER the `.Values.env` range, which means it wins
            # over a same-named values key rather than losing to one. That is not
            # an oversight: the running image's digest is a FACT about this pod,
            # not a setting, and a values-supplied digest would be free to be
            # stale — which is the exact defect this entry exists to close.
            - name: DOC_TOOLS_IMAGE
              value: {{ include "doc-tools.image" . | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts .Values.manufacturingOverlay.enabled }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.manufacturingOverlay.enabled }}
            - name: manufacturing-overlay
              mountPath: {{ .Values.manufacturingOverlay.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.manufacturingOverlay.enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.manufacturingOverlay.enabled }}
        - name: manufacturing-overlay
          secret:
            secretName: {{ .Values.manufacturingOverlay.existingSecret | default (printf "%s-manufacturing-overlay" (include "doc-tools.fullname" .)) }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
