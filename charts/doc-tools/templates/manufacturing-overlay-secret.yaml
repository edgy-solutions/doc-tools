{{- if .Values.manufacturingOverlay.enabled }}
{{- if and (not .Values.manufacturingOverlay.existingSecret) (not .Values.manufacturingOverlay.spec) }}
{{- fail "manufacturingOverlay.enabled is true but neither manufacturingOverlay.existingSecret nor manufacturingOverlay.spec is set" }}
{{- end }}
{{- if and (not .Values.manufacturingOverlay.existingSecret) .Values.manufacturingOverlay.spec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doc-tools.fullname" . }}-manufacturing-overlay
  labels:
    {{- include "doc-tools.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.manufacturingOverlay.secretKey }}: |
    {{- .Values.manufacturingOverlay.spec | nindent 4 }}
{{- end }}
{{- end }}
